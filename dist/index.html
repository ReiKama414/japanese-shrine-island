<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Japanese Shrine Island — Interactive 3D WebGL Diorama</title>
  <script src="https://cdn.tailwindcss.com/3.4.17" async></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ede8df;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Noto Sans JP', 'Segoe UI', sans-serif;
      color: #1f1e1b;
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    #canvas-container {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    /* Complete self-contained layout utilities so UI renders identically with or without CDN */
    .fixed { position: fixed; }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .top-4 { top: 1rem; }
    .left-4 { left: 1rem; }
    .right-4 { right: 1rem; }
    .bottom-4 { bottom: 1rem; }
    .bottom-20 { bottom: 4.75rem; }
    .left-center { left: 50%; transform: translateX(-50%); }
    .z-10 { z-index: 10; }
    .z-20 { z-index: 20; }
    .z-30 { z-index: 30; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .flex-1 { flex: 1 1 0%; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-1 { gap: 0.25rem; }
    .gap-1\.5 { gap: 0.375rem; }
    .gap-2 { gap: 0.5rem; }
    .p-1 { padding: 0.25rem; }
    .p-1\.5 { padding: 0.375rem; }
    .p-4 { padding: 1rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .px-2\.5 { padding-left: 0.625rem; padding-right: 0.625rem; }
    .py-1\.5 { padding-top: 0.375rem; padding-bottom: 0.375rem; }
    .pt-1 { padding-top: 0.25rem; }
    .pt-2 { padding-top: 0.5rem; }
    .mb-1 { margin-bottom: 0.25rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mx-0\.5 { margin-left: 0.125rem; margin-right: 0.125rem; }
    .w-72 { width: 18rem; }
    .w-3\.5 { width: 0.875rem; }
    .h-3\.5 { height: 0.875rem; }
    .w-5 { width: 1.25rem; }
    .h-5 { height: 1.25rem; }
    .w-2 { width: 0.5rem; }
    .h-2 { height: 0.5rem; }
    .h-4 { height: 1rem; }
    .w-px { width: 1px; }
    .rounded-full { border-radius: 9999px; }
    .rounded-2xl { border-radius: 1rem; }
    .rounded-xl { border-radius: 0.75rem; }
    .rounded-lg { border-radius: 0.5rem; }
    .rounded { border-radius: 0.25rem; }
    .grid { display: grid; }
    .grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .space-y-4 > * + * { margin-top: 1rem; }
    .space-y-2\.5 > * + * { margin-top: 0.625rem; }
    .overflow-hidden { overflow: hidden; }
    .overflow-y-auto { overflow-y: auto; }
    .text-xs { font-size: 0.75rem; line-height: 1rem; }
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .font-semibold { font-weight: 600; }
    .font-medium { font-weight: 500; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .uppercase { text-transform: uppercase; }
    .tracking-wider { letter-spacing: 0.05em; }
    .border-b { border-bottom: 1px solid rgba(28, 25, 23, 0.1); }
    .border-t { border-top: 1px solid rgba(28, 25, 23, 0.1); }
    .bg-red-600 { background-color: #dc2626; }
    .text-amber-500 { color: #f59e0b; }
    .text-amber-600 { color: #d97706; }
    .text-indigo-400 { color: #818cf8; }
    .text-teal-600 { color: #0d9488; }
    .text-stone-500 { color: #78716c; }
    .text-stone-700 { color: #44403c; }
    .text-stone-800 { color: #292524; }
    .bg-transparent { background-color: transparent; }
    .cursor-pointer { cursor: pointer; }
    .hidden { display: none !important; }

    /* Adaptive Glassmorphic Theme (Day Ivory Glass <-> Night Obsidian Glass) */
    .glass-bar {
      background: rgba(252, 249, 244, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(35, 32, 26, 0.09);
      box-shadow: 0 10px 30px -6px rgba(32, 28, 20, 0.14), 0 2px 6px -1px rgba(32, 28, 20, 0.06);
      transition: background 0.45s ease, border-color 0.45s ease, box-shadow 0.45s ease, color 0.45s ease;
    }
    body.night-ui .glass-bar {
      background: rgba(19, 26, 42, 0.86);
      border-color: rgba(148, 179, 245, 0.16);
      box-shadow: 0 12px 34px -6px rgba(2, 6, 16, 0.65), 0 2px 8px -1px rgba(148, 179, 245, 0.08);
      color: #e6ecf8;
    }

    .ctrl-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.38rem 0.72rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #36332e;
      background: transparent;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .ctrl-pill:hover {
      background: rgba(35, 32, 26, 0.07);
      color: #141311;
    }
    body.night-ui .ctrl-pill {
      color: #cbd5e8;
    }
    body.night-ui .ctrl-pill:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #ffffff;
    }
    .ctrl-pill.active-pill {
      background: #1f1e1b;
      color: #f8f5ef;
      box-shadow: 0 2px 8px rgba(20, 18, 14, 0.22);
    }
    body.night-ui .ctrl-pill.active-pill {
      background: #3b5998;
      border-color: rgba(165, 196, 255, 0.35);
      color: #ffffff;
      box-shadow: 0 2px 12px rgba(59, 89, 152, 0.45);
    }

    /* Custom Popover Dropdown Menu */
    .custom-dropdown-menu {
      position: absolute;
      min-width: 9.5rem;
      padding: 0.35rem;
      border-radius: 0.875rem;
      background: rgba(252, 249, 244, 0.96);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(35, 32, 26, 0.11);
      box-shadow: 0 14px 34px -6px rgba(24, 20, 14, 0.18), 0 4px 10px -2px rgba(24, 20, 14, 0.08);
      z-index: 40;
      transform-origin: bottom center;
      animation: menuPop 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .custom-dropdown-menu.top-down-menu {
      transform-origin: top right;
    }
    body.night-ui .custom-dropdown-menu {
      background: rgba(18, 25, 42, 0.95);
      border-color: rgba(148, 179, 245, 0.2);
      box-shadow: 0 16px 38px -6px rgba(0, 0, 0, 0.7);
    }
    @keyframes menuPop {
      from { opacity: 0; transform: scale(0.95) translateY(4px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .dropdown-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.42rem 0.65rem;
      border-radius: 0.55rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #36332e;
      background: transparent;
      border: 0;
      cursor: pointer;
      text-align: left;
      transition: background 0.14s ease, color 0.14s ease;
    }
    .dropdown-item:hover {
      background: rgba(35, 32, 26, 0.07);
      color: #111;
    }
    body.night-ui .dropdown-item {
      color: #d1dbf0;
    }
    body.night-ui .dropdown-item:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .dropdown-item.active-dropdown-item {
      background: rgba(31, 30, 27, 0.09);
      font-weight: 600;
      color: #111;
    }
    body.night-ui .dropdown-item.active-dropdown-item {
      background: rgba(82, 122, 204, 0.28);
      color: #fff;
    }
    .check-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .dropdown-item.active-dropdown-item .check-dot {
      opacity: 1;
    }
    .dropdown-chevron {
      width: 0.75rem;
      height: 0.75rem;
      opacity: 0.65;
      transition: transform 0.2s ease;
    }
    .swatch-dot {
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 999px;
      display: inline-block;
      border: 1px solid rgba(0,0,0,0.15);
    }

    .preset-chip {
      padding: 0.28rem 0.35rem;
      border-radius: 0.5rem;
      font-size: 0.68rem;
      font-weight: 500;
      border: 1px solid rgba(35, 32, 26, 0.12);
      background: rgba(255, 255, 255, 0.55);
      color: #38342e;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }
    .preset-chip:hover {
      background: rgba(255, 255, 255, 0.9);
    }
    body.night-ui .preset-chip {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.14);
      color: #cbd5e8;
    }
    .preset-chip.active-chip {
      background: #1f1e1b;
      color: #ffffff;
      border-color: #1f1e1b;
    }
    body.night-ui .preset-chip.active-chip {
      background: #3b5998;
      color: #ffffff;
      border-color: #6389df;
    }
    .color-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.6);
      padding: 0.375rem 0.625rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(28, 25, 23, 0.1);
    }
    body.night-ui .color-box {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.12);
    }
    body.night-ui .text-stone-700,
    body.night-ui .text-stone-800 {
      color: #e2e8f4;
    }
    body.night-ui .text-stone-500,
    body.night-ui .section-label,
    body.night-ui .val-badge {
      color: #94a3b8;
    }
    body.night-ui .border-b,
    body.night-ui .border-t {
      border-color: rgba(255, 255, 255, 0.1);
    }
    body.night-ui .divider {
      background: rgba(255, 255, 255, 0.14);
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(35, 32, 26, 0.15);
      border-radius: 999px;
      outline: none;
    }
    body.night-ui input[type="range"] {
      background: rgba(255, 255, 255, 0.18);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #1f1e1b;
      cursor: pointer;
      border: 2px solid #fcf9f4;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }
    body.night-ui input[type="range"]::-webkit-slider-thumb {
      background: #60a5fa;
      border-color: #0f172a;
    }
    .tune-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .tune-scroll::-webkit-scrollbar-thumb {
      background: rgba(35, 32, 26, 0.18);
      border-radius: 999px;
    }
    .divider {
      height: 1rem;
      width: 1px;
      background: rgba(28, 25, 23, 0.12);
      margin: 0 0.125rem;
    }
    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #78716c;
    }
    .val-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: #78716c;
    }
  </style>
</head>
<body>
  <!-- Full-Screen 3D WebGL Viewport -->
  <div id="canvas-container" aria-label="Interactive 3D Japanese Shrine Island Diorama"></div>

  <!-- Top-Left Camera Landmark Framing Pills -->
  <div class="fixed top-4 left-4 z-10 flex items-center gap-1 p-1 rounded-full glass-bar">
    <button type="button" data-cam-view="overview" data-i18n="cam_overview" class="ctrl-pill active-pill" title="Isometric Diorama Overview">Overview</button>
    <button type="button" data-cam-view="torii" data-i18n="cam_torii" class="ctrl-pill" title="Focus on Grand Ryobu Torii Gate">O-Torii</button>
    <button type="button" data-cam-view="shrine" data-i18n="cam_shrine" class="ctrl-pill" title="Focus on Floating Shrine Hall">Shrine</button>
    <button type="button" data-cam-view="pagoda" data-i18n="cam_pagoda" class="ctrl-pill" title="Focus on Five-Story Pagoda">Pagoda</button>
    <button type="button" data-cam-view="topdown" data-i18n="cam_topdown" class="ctrl-pill" title="Aerial Plan View">Aerial</button>
  </div>

  <!-- Top-Right Custom Language Selector Dropdown (English / 繁體中文 / 日本語) -->
  <div id="dropdown-lang" class="fixed top-4 right-4 z-30">
    <div class="p-1 rounded-full glass-bar">
      <button id="btn-lang-trigger" type="button" class="ctrl-pill" title="Switch Language / 切換語言 / 言語切替">
        <svg class="w-3.5 h-3.5 opacity-80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <line x1="2" y1="12" x2="22" y2="12" />
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
        </svg>
        <span id="label-lang">繁體中文</span>
        <svg data-chevron-for="menu-lang" class="dropdown-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>
    </div>

    <div id="menu-lang" class="custom-dropdown-menu top-down-menu hidden" style="right:0; top:calc(100% + 0.45rem);">
      <button type="button" data-lang-option="zh" class="dropdown-item active-dropdown-item">
        <span>繁體中文</span>
        <span class="check-dot"></span>
      </button>
      <button type="button" data-lang-option="en" class="dropdown-item">
        <span>English</span>
        <span class="check-dot"></span>
      </button>
      <button type="button" data-lang-option="ja" class="dropdown-item">
        <span>日本語</span>
        <span class="check-dot"></span>
      </button>
    </div>
  </div>

  <!-- Right-Side Expandable Live Tune Inspector Drawer -->
  <aside id="panel-tune" class="hidden fixed right-4 bottom-20 w-72 z-20 rounded-2xl glass-bar flex flex-col overflow-hidden" style="top: 4.25rem;">
    <div class="flex items-center justify-between px-4 py-3 border-b">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-red-600"></span>
        <h2 data-i18n="tuneTitle" class="text-xs font-semibold uppercase tracking-wider text-stone-800" style="margin:0;">Diorama Studio Tune</h2>
      </div>
      <button id="btn-close-tune" type="button" class="text-stone-500 text-sm cursor-pointer bg-transparent" style="border:0;padding:2px 6px;" title="Close Tune Panel">✕</button>
    </div>

    <div class="p-4 space-y-4 overflow-y-auto tune-scroll text-xs flex-1">
      <!-- Atmosphere & Water Presets -->
      <div>
        <div data-i18n="secPreset" class="section-label mb-2">Water &amp; Season Preset</div>
        <div class="grid grid-cols-4 gap-1.5">
          <button type="button" data-preset-chip="summer" data-i18n="preset_summer" class="preset-chip active-chip">Summer</button>
          <button type="button" data-preset-chip="cobalt" data-i18n="preset_cobalt" class="preset-chip">Cobalt</button>
          <button type="button" data-preset-chip="emerald" data-i18n="preset_emerald" class="preset-chip">Emerald</button>
          <button type="button" data-preset-chip="sakura" data-i18n="preset_sakura" class="preset-chip">Sakura</button>
        </div>
      </div>

      <!-- Day & Night Cycle Transition Slider -->
      <div class="space-y-2.5 pt-2 border-t">
        <div data-i18n="secDayNight" class="section-label">Day &amp; Night Cycle</div>
        <div>
          <div class="flex justify-between mb-1">
            <label for="slider-day-night" data-i18n="lblDayNightMix" class="text-stone-700">Time Transition</label>
            <span id="val-day-night" class="val-badge">0%</span>
          </div>
          <input id="slider-day-night" type="range" min="0.00" max="1.00" step="0.01" value="0.00" />
        </div>
      </div>

      <!-- Water Parameters -->
      <div class="space-y-2.5 pt-2 border-t">
        <div data-i18n="secWater" class="section-label">Water &amp; Tide</div>

        <div>
          <div class="flex justify-between mb-1">
            <label for="slider-water-level" data-i18n="lblWaterLevel" class="text-stone-700">Tide Level</label>
            <span id="val-water-level" class="val-badge">0.00m</span>
          </div>
          <input id="slider-water-level" type="range" min="-0.54" max="0.18" step="0.01" value="0.00" />
        </div>

        <div>
          <div class="flex justify-between mb-1">
            <label for="slider-wave-height" data-i18n="lblWaveHeight" class="text-stone-700">Wave Amplitude</label>
            <span id="val-wave-height" class="val-badge">0.048</span>
          </div>
          <input id="slider-wave-height" type="range" min="0.005" max="0.120" step="0.005" value="0.048" />
        </div>

        <div>
          <div class="flex justify-between mb-1">
            <label for="slider-clarity" data-i18n="lblClarity" class="text-stone-700">Water Clarity</label>
            <span id="val-clarity" class="val-badge">1.15</span>
          </div>
          <input id="slider-clarity" type="range" min="0.40" max="2.00" step="0.05" value="1.15" />
        </div>

        <div>
          <div class="flex justify-between mb-1">
            <label for="slider-foam" data-i18n="lblFoam" class="text-stone-700">Shoreline Foam</label>
            <span id="val-foam" class="val-badge">92%</span>
          </div>
          <input id="slider-foam" type="range" min="0.0" max="1.5" step="0.05" value="0.92" />
        </div>

        <div class="grid grid-cols-2 gap-2 pt-1">
          <label class="color-box">
            <span data-i18n="lblShallow" class="text-stone-700">Shallow</span>
            <input id="color-shallow" type="color" value="#5ee0d4" class="w-5 h-5 rounded cursor-pointer bg-transparent" style="border:0;" />
          </label>
          <label class="color-box">
            <span data-i18n="lblDeep" class="text-stone-700">Deep</span>
            <input id="color-deep" type="color" value="#096575" class="w-5 h-5 rounded cursor-pointer bg-transparent" style="border:0;" />
          </label>
        </div>
      </div>

      <!-- Studio Lighting & Island -->
      <div class="space-y-2.5 pt-2 border-t">
        <div data-i18n="secLight" class="section-label">Lighting &amp; Island</div>

        <div>
          <div class="flex justify-between mb-1">
            <label for="slider-sun-el" data-i18n="lblSunEl" class="text-stone-700">Sun Elevation</label>
            <span id="val-sun-el" class="val-badge">48°</span>
          </div>
          <input id="slider-sun-el" type="range" min="15" max="80" step="1" value="48" />
        </div>

        <div>
          <div class="flex justify-between mb-1">
            <label for="slider-sun-az" data-i18n="lblSunAz" class="text-stone-700">Sun Azimuth</label>
            <span id="val-sun-az" class="val-badge">36°</span>
          </div>
          <input id="slider-sun-az" type="range" min="-180" max="180" step="2" value="36" />
        </div>

        <div>
          <div class="flex justify-between mb-1">
            <label for="slider-foliage" data-i18n="lblFoliage" class="text-stone-700">Pine Canopy Height</label>
            <span id="val-foliage" class="val-badge">100%</span>
          </div>
          <input id="slider-foliage" type="range" min="0.70" max="1.35" step="0.05" value="1.00" />
        </div>

        <div>
          <div class="flex justify-between mb-1">
            <label for="slider-fov" data-i18n="lblFov" class="text-stone-700">Camera Lens FOV</label>
            <span id="val-fov" class="val-badge">36°</span>
          </div>
          <input id="slider-fov" type="range" min="24" max="55" step="1" value="36" />
        </div>
      </div>
    </div>
  </aside>

  <!-- Minimal Bottom Floating Pill Control Bar with Custom Popover Dropdowns -->
  <nav aria-label="Diorama Controls" class="fixed bottom-4 left-center z-20 flex items-center gap-1 p-1.5 rounded-full glass-bar" style="max-width:96vw;">
    <!-- Reset Camera -->
    <button id="btn-reset-cam" type="button" class="ctrl-pill" title="Reset Camera to Isometric View">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </svg>
      <span data-i18n="reset">Reset</span>
    </button>

    <!-- Auto Rotate Toggle -->
    <button id="btn-autorotate" type="button" class="ctrl-pill" aria-pressed="false" title="Toggle Smooth Turntable Auto-Rotation">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        const phi = phiStart + i * invSegments * phiLength;

      for (let i = 0; i < segments; i++) {
        for (let j = 0; j < points.length - 1; j++) {
          const base = j + i * points.length;
          const a = base;
          const b = base + points.length;
          const c = base + points.length + 1;
          const d = base + 1;
          indices.push(a, b, d, b, c, d);

      this.setAttribute('position', new Float32BufferAttribute(positions, 3));

  const SHADOW_VERT = `

      const vec4 bitMask = vec4(0.0, 1.0/256.0, 1.0/256.0, 1.0/256.0);
      vec4 res = fract(depth * bitShift);
      res -= res.xxyz * bitMask;

    }

  const STANDARD_VERT = `
    precision highp float;
    uniform mat4 modelMatrix;
    uniform mat4 viewMatrix;
    uniform mat4 modelViewMatrix;
    uniform mat4 projectionMatrix;
    uniform mat4 uLightSpaceMatrix;
    uniform float uPointSize;

    attribute vec3 position;
    attribute vec3 normal;
    attribute vec2 uv;
    attribute vec3 color;

    varying vec3 vWorldPos;
    varying vec3 vWorldNormal;
    varying vec3 vColor;
    varying vec2 vUv;
    varying float vViewDepth;
    varying vec4 vLightSpacePos;

    void main() {
      vec4 worldPos = modelMatrix * vec4(position, 1.0);
      vWorldPos = worldPos.xyz;
      vWorldNormal = normalize(mat3(modelMatrix) * normal);
      vColor = color;
      vUv = uv;
      vec4 mvPos = viewMatrix * worldPos;
      vViewDepth = -mvPos.z;
      vLightSpacePos = uLightSpaceMatrix * worldPos;
      gl_Position = projectionMatrix * mvPos;
      gl_PointSize = uPointSize * (28.0 / max(1.0, vViewDepth));

    uniform vec3 cameraPosition;
    uniform vec3 uBaseColor;
    uniform vec3 uEmissive;
    uniform float uEmissiveIntensity;
    uniform float uRoughness;
    uniform float uMetalness;
    uniform float uOpacity;
    uniform float uUseVertexColors;
    uniform float uIsUnlit;
    uniform float uFlatShading;
    uniform float uReceiveShadow;
    uniform float uWaterLevel;
    uniform float uTime;

    uniform sampler2D uShadowMap;
    uniform float uHasShadowMap;

    uniform vec3 uAmbientColor;
    uniform vec3 uHemiSky;
    uniform vec3 uHemiGround;
    uniform float uHemiIntensity;

    uniform vec3 uDirLightDir[2];
    uniform vec3 uDirLightColor[2];

    uniform vec3 uPointLightPos[8];
    uniform vec3 uPointLightColor[8];
    uniform float uPointLightDist[8];

    uniform vec3 uFogColor;
    uniform float uFogDensity;

    varying vec3 vWorldPos;
    varying vec3 vWorldNormal;
    varying vec3 vColor;
    varying vec2 vUv;
    varying float vViewDepth;
    varying vec4 vLightSpacePos;

    float unpackDepth(const in vec4 rgbaDepth) {
      const vec4 bitShift = vec4(1.0/(256.0*256.0*256.0), 1.0/(256.0*256.0), 1.0/256.0, 1.0);
      return dot(rgbaDepth, bitShift);

    float computeShadow(vec4 lightSpacePos, vec3 N, vec3 L) {
      if (uHasShadowMap < 0.5 || uReceiveShadow < 0.5) return 1.0;

      projCoords = projCoords * 0.5 + 0.5;

      float bias = max(0.0025 * (1.0 - dot(N, L)), 0.0012);
      float shadow = 0.0;
      float texel = 1.0 / 2048.0;

      vec3 N = normalize(vWorldNormal);

      vec3 specAccum = vec3(0.0);

        roughness = mix(roughness, 0.16, wetness * 0.85);

      float shininess = mix(96.0, 8.0, roughness);
      float specStrength = mix(0.62, 0.04, roughness) + uMetalness * 0.45;

      for (int i = 0; i < 2; i++) {
        vec3 L = normalize(uDirLightDir[i]);

        float wrap = max((dot(N, L) + 0.18) / 1.18, 0.0);
        float sh = (i == 0) ? computeShadow(vLightSpacePos, N, L) : 1.0;
        lighting += uDirLightColor[i] * mix(ndl, wrap, 0.25) * 0.88 * sh;
        if (ndl > 0.0 && sh > 0.4) {
          vec3 H = normalize(L + V);
          float spec = pow(max(dot(N, H), 0.0), shininess);
          specAccum += uDirLightColor[i] * spec * specStrength * sh;

      for (int i = 0; i < 8; i++) {
        vec3 toLight = uPointLightPos[i] - vWorldPos;
        float dist = length(toLight);
        float maxD = uPointLightDist[i];
        if (maxD > 0.0 && dist < maxD) {
          vec3 L = toLight / max(dist, 0.0001);
          float atten = pow(clamp(1.0 - dist / maxD, 0.0, 1.0), 1.8);
          float ndl = max((dot(N, L) + 0.25) / 1.25, 0.0);
          lighting += uPointLightColor[i] * ndl * atten * 0.95;
          vec3 H = normalize(L + V);
          float spec = pow(max(dot(N, H), 0.0), shininess * 0.7);
          specAccum += uPointLightColor[i] * spec * atten * specStrength;
        }

      vec3 linearCol = linearAlbedo * lighting + specAccum * 0.5 + uEmissive * uEmissiveIntensity;

      // Underwater caustic light patterns & depth tint for submerged seabed/rocks (excluding outer base plinth)
      float maxCoord = max(abs(vWorldPos.x), abs(vWorldPos.z));
      if (vWorldPos.y < uWaterLevel - 0.01 && vWorldPos.y > -1.90 && maxCoord < 11.15) {
        float subDepth = clamp((uWaterLevel - vWorldPos.y) / 1.75, 0.0, 1.0);
        float c1 = sin(vWorldPos.x * 4.8 + uTime * 1.6 + sin(vWorldPos.z * 3.7 - uTime * 1.1));
        float c2 = cos(vWorldPos.z * 5.2 - uTime * 1.4 + cos(vWorldPos.x * 4.1 + uTime * 1.3));
        float caustic = pow(max(0.0, c1 * c2), 2.0) * 0.24 * (1.0 - subDepth * 0.45);
        float ambScale = clamp(length(uAmbientColor), 0.16, 1.0);
        linearCol += vec3(0.22, 0.68, 0.72) * caustic * ambScale;
        linearCol = mix(linearCol, linearCol * vec3(0.45, 0.88, 0.90), subDepth * 0.42);
      }

      // ACES Filmic Tone Mapping + convert back to sRGB
      linearCol = (linearCol * (2.51 * linearCol + 0.03)) / (linearCol * (2.43 * linearCol + 0.59) + 0.14);
      vec3 finalSrgb = pow(clamp(linearCol, 0.0, 1.0), vec3(1.0 / 2.1));

      if (uFogDensity > 0.0001) {
        float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity * vViewDepth * vViewDepth);
        finalSrgb = mix(finalSrgb, uFogColor, clamp(fogFactor, 0.0, 0.55));
      }

      gl_FragColor = vec4(finalSrgb, uOpacity);
    }
  `;

      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

  }

      lerp(grad2(perm[A + 1], x, y - 1), grad2(perm[B + 1], x - 1, y - 1), u),

    }

    // (b) Rear Honden Sanctuary Stone Foundation Terrace at (x = -0.35, z = -1.55) -> target y = 0.34
    const honDist = Math.hypot((x + 0.35) / 1.95, (z + 1.55) / 1.25);
    if (honDist < 1.3) {
      const wHon = 1.0 - smoothstep(0.65, 1.3, honDist);
      h = lerp(h, 0.34, wHon * 0.88);
    }

    // (c) Front Haiden & Hirabutai tidal lagoon bed at (x = -0.35, z = 0.15) -> gentle shallow bed y = -0.16
    const haiDist = Math.hypot((x + 0.35) / 2.3, (z - 0.15) / 1.65);
    if (haiDist < 1.25) {
      const wHai = 1.0 - smoothstep(0.55, 1.25, haiDist);
      h = lerp(h, -0.16, wHai * 0.72);
    }

    // 6. Keep outer perimeter seabed below water (-0.48 to -0.96)
    const edgeSd = sdRoundedBox2D(x, z, DIORAMA_HALF, DIORAMA_CORNER);
    if (edgeSd > -2.0) {
      const edgeT = smoothstep(-2.0, -0.1, edgeSd);
      const targetEdgeDepth = -0.92 - 0.28 * smoothstep(-4.0, 6.0, z - x * 0.35) + fbm2(x * 0.35, z * 0.35, 2) * 0.05;
      h = lerp(h, Math.min(h, targetEdgeDepth), edgeT);
    }

    return Math.max(-1.24, h);
  }

  function getTerrainNormal(x, z, eps = 0.08) {
    const hL = getTerrainHeight(x - eps, z);
    const hR = getTerrainHeight(x + eps, z);
    const hD = getTerrainHeight(x, z - eps);
    const hU = getTerrainHeight(x, z + eps);
    const nx = hL - hR;
    const ny = 2.0 * eps;
    const nz = hD - hU;
    const len = Math.hypot(nx, ny, nz) || 1;
    return { x: nx / len, y: ny / len, z: nz / len };
  }

  function buildIslandTerrainGroup(THREE, segments = 156) {
    const group = new THREE.Group();
    group.name = 'IslandTerrainGroup';

    const gridN = segments;
    const gridN1 = gridN + 1;
    const positions = [];
    const normals = [];
    const colors = [];
    const uvs = [];
    const indices = [];

    const cDeepSand = new THREE.Color('#8ca89f');
    const cShallowSand = new THREE.Color('#e2d4b7');
    const cWetSand = new THREE.Color('#c7b38f');
    const cDrySand = new THREE.Color('#efe2c8');
    const cCliffDark = new THREE.Color('#454843');
    const cCliffMid = new THREE.Color('#636760');
    const cCliffLight = new THREE.Color('#7c8077');
    const cMossDark = new THREE.Color('#233f1e');
    const cMossMid = new THREE.Color('#325428');
    const cMossLight = new THREE.Color('#466934');
    const tmpCol = new THREE.Color();

    for (let iz = 0; iz <= gridN; iz++) {
      const v = (iz / gridN) * 2 - 1;
      for (let ix = 0; ix <= gridN; ix++) {
        const u = (ix / gridN) * 2 - 1;
        const pt = mapGridToRoundedSquare(u, v, DIORAMA_HALF, DIORAMA_CORNER);
        let h = getTerrainHeight(pt.x, pt.z);
        const n = getTerrainNormal(pt.x, pt.z, 0.09);

        if (h > 0.25 && n.y < 0.78) {
          const strata = Math.sin(h * 7.5 + fbm2(pt.x * 0.9, pt.z * 0.9, 2) * 2.0) * 0.035 * (1.0 - n.y);
          h += strata;
        }

        positions.push(pt.x, h, pt.z);
        normals.push(n.x, n.y, n.z);
        uvs.push(ix / gridN, iz / gridN);

        const nVal = fbm2(pt.x * 0.65 + 7.1, pt.z * 0.65 - 3.4, 3);
        const detailVal = noise2D(pt.x * 2.4, pt.z * 2.4);

        if (h < -0.36) {
          const depthT = smoothstep(-0.36, -0.95, h);
          tmpCol.copy(cShallowSand).lerp(cDeepSand, depthT * 0.75);
          if (nVal + detailVal * 0.4 > 0.24) {
            tmpCol.lerp(cCliffDark, 0.28);
          }
        } else if (h < -0.04) {
          const t = smoothstep(-0.36, -0.04, h);
          tmpCol.copy(cShallowSand).lerp(cWetSand, t * 0.65);
        } else if (h < 0.35) {
          const t = smoothstep(-0.04, 0.35, h);
          tmpCol.copy(cWetSand).lerp(cDrySand, t);
          const isLeftStack = Math.hypot(pt.x + 4.25, pt.z - 0.55) < 1.65;
          const isRightStack = Math.hypot(pt.x - 2.75, pt.z - 1.95) < 1.75;
          if (n.y < 0.80 || isLeftStack || isRightStack) {
            const rockMix = (isLeftStack || isRightStack) ? 0.88 : smoothstep(0.80, 0.55, n.y);
            tmpCol.lerp(cCliffMid, rockMix);
          }
        } else {
          // Above beach: lush mossy green mountain slopes with rocky outcrops only on the steepest lower cliffs
          const slopeT = smoothstep(0.42, 0.72, n.y);
          const heightMossBoost = smoothstep(0.6, 2.2, h) * 0.45;
          const mossWeight = Math.min(1.0, slopeT + heightMossBoost);
          const strataBand = 0.5 + 0.5 * Math.sin(h * 6.2 + nVal * 4.0);
          const rockCol = cCliffDark.clone().lerp(cCliffMid, strataBand).lerp(cCliffLight, Math.max(0, detailVal));
          const mossCol = cMossDark.clone().lerp(cMossMid, smoothstep(0.4, 3.8, h)).lerp(cMossLight, Math.max(0, nVal + 0.15));
          tmpCol.copy(rockCol).lerp(mossCol, mossWeight);
        }

        const microShade = 0.94 + 0.12 * detailVal;
        colors.push(
          Math.min(1, tmpCol.r * microShade),
          Math.min(1, tmpCol.g * microShade),
          Math.min(1, tmpCol.b * microShade)
        );
      }
    }

    for (let iz = 0; iz < gridN; iz++) {
      for (let ix = 0; ix < gridN; ix++) {
        const a = iz * gridN1 + ix;
        const b = (iz + 1) * gridN1 + ix;
        const c = (iz + 1) * gridN1 + (ix + 1);
        const d = iz * gridN1 + (ix + 1);
        indices.push(a, b, d, b, c, d);
      }
    }

    const terrainGeom = new THREE.BufferGeometry();
    terrainGeom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    terrainGeom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    terrainGeom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    terrainGeom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    terrainGeom.setIndex(indices);

    const terrainMat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.86,
      metalness: 0.04
    });
    const terrainMesh = new THREE.Mesh(terrainGeom, terrainMat);
    terrainMesh.castShadow = true;
    terrainMesh.receiveShadow = true;
    terrainMesh.name = 'IslandTerrainMesh';
    group.add(terrainMesh);

    // 2. Perimeter Warm Sandstone/Wood Diorama Plinth Base
    const perimPts = [];
    for (let i = 0; i < gridN; i++) perimPts.push(mapGridToRoundedSquare((i / gridN) * 2 - 1, -1));
    for (let i = 0; i < gridN; i++) perimPts.push(mapGridToRoundedSquare(1, (i / gridN) * 2 - 1));
    for (let i = 0; i < gridN; i++) perimPts.push(mapGridToRoundedSquare(1 - (i / gridN) * 2, 1));
    for (let i = 0; i < gridN; i++) perimPts.push(mapGridToRoundedSquare(-1, 1 - (i / gridN) * 2));

    const skirtPos = [], skirtNorm = [], skirtCol = [], skirtIdx = [];
    const cEarthTop = new THREE.Color('#c2a472');
    const cEarthBot = new THREE.Color('#96784a');
    const pCount = perimPts.length;

    for (let i = 0; i <= pCount; i++) {
      const pt = perimPts[i % pCount];
      const nextPt = perimPts[(i + 1) % pCount];
      const prevPt = perimPts[(i - 1 + pCount) % pCount];
      const tx = nextPt.x - prevPt.x, tz = nextPt.z - prevPt.z;
      const tLen = Math.hypot(tx, tz) || 1;
      const nx = tz / tLen, nz = -tx / tLen;

      const topY = getTerrainHeight(pt.x, pt.z);
      const botY = BASE_BOTTOM_Y;

      skirtPos.push(pt.x, topY, pt.z);
      skirtNorm.push(nx, 0.05, nz);
      skirtCol.push(cEarthTop.r, cEarthTop.g, cEarthTop.b);

      skirtPos.push(pt.x, botY, pt.z);
      skirtNorm.push(nx, -0.05, nz);
      skirtCol.push(cEarthBot.r, cEarthBot.g, cEarthBot.b);
    }

    for (let i = 0; i < pCount; i++) {
      const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2 + 1, d = (i + 1) * 2;
      skirtIdx.push(a, d, b, b, d, c);
    }

    const centerBotIdx = skirtPos.length / 3;
    skirtPos.push(0, BASE_BOTTOM_Y - 0.08, 0);
    skirtNorm.push(0, -1, 0);
    skirtCol.push(0.45, 0.35, 0.22);

    for (let i = 0; i <= pCount; i++) {
      const pt = perimPts[i % pCount];
      skirtPos.push(pt.x * 0.99, BASE_BOTTOM_Y - 0.08, pt.z * 0.99);
      skirtNorm.push(0, -1, 0);
      skirtCol.push(0.48, 0.38, 0.24);
    }
    for (let i = 0; i < pCount; i++) {
      const b1 = i * 2 + 1;
      const b2 = (i + 1) * 2 + 1;
      const c1 = centerBotIdx + 1 + i;
      const c2 = centerBotIdx + 1 + i + 1;
      skirtIdx.push(b1, c1, b2, b2, c1, c2);
      skirtIdx.push(centerBotIdx, c2, c1);
    }

    const skirtGeom = new THREE.BufferGeometry();
    skirtGeom.setAttribute('position', new THREE.Float32BufferAttribute(skirtPos, 3));
    skirtGeom.setAttribute('normal', new THREE.Float32BufferAttribute(skirtNorm, 3));
    skirtGeom.setAttribute('color', new THREE.Float32BufferAttribute(skirtCol, 3));
    skirtGeom.setIndex(skirtIdx);

    const skirtMesh = new THREE.Mesh(skirtGeom, new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.78,
      metalness: 0.05
    }));
    skirtMesh.castShadow = true;
    skirtMesh.receiveShadow = true;
    group.add(skirtMesh);

    // 3. Studio Soft Drop-Shadow Plane under the Diorama Block
    const shadowPlaneGeom = new THREE.PlaneGeometry(34, 34, 36, 36);
    const spPos = shadowPlaneGeom.attributes.position;
    const spCols = [];
    for (let i = 0; i < spPos.count; i++) {
      const x = spPos.getX(i);
      const z = -spPos.getY(i);
      spPos.setXYZ(i, x, BASE_BOTTOM_Y - 0.10, z);
      const sd = sdRoundedBox2D(x - 0.35, z - 0.45, DIORAMA_HALF + 0.15, DIORAMA_CORNER);
      const shadowAlpha = 1.0 - smoothstep(-0.5, 3.0, sd);
      const shade = lerp(1.0, 0.76, shadowAlpha * 0.88);
      spCols.push(shade, shade, shade);
    }
    shadowPlaneGeom.computeVertexNormals();
    shadowPlaneGeom.setAttribute('color', new THREE.Float32BufferAttribute(spCols, 3));
    const shadowPlaneMat = new THREE.MeshBasicMaterial({
      color: '#ede8df',
      vertexColors: true
    });
    const shadowPlane = new THREE.Mesh(shadowPlaneGeom, shadowPlaneMat);
    shadowPlane.name = 'StudioShadowPlane';
    group.add(shadowPlane);

    // 4. Sculpted Coastal Boulders, Sea Stacks, & Submerged Reef Stones
    const rockSpecs = [
      // Left Sea-Stack Promontory cluster (-4.25, 0.55)
      { x: -4.25, z: 0.55, r: 0.88, sy: 1.15, moss: 0.75 },
      { x: -4.75, z: 0.95, r: 0.58, sy: 0.85, moss: 0.45 },
      { x: -3.65, z: 0.85, r: 0.50, sy: 0.75, moss: 0.50 },
      { x: -4.55, z: -0.15, r: 0.62, sy: 0.95, moss: 0.65 },
      // Right Sea-Stack Promontory cluster (2.75, 1.95)
      { x: 2.75, z: 1.95, r: 0.96, sy: 1.22, moss: 0.80 },
      { x: 3.45, z: 2.25, r: 0.58, sy: 0.82, moss: 0.45 },
      { x: 2.15, z: 2.35, r: 0.48, sy: 0.72, moss: 0.35 },
      { x: 3.15, z: 1.35, r: 0.65, sy: 0.98, moss: 0.65 },
      // Scattered shoreline & underwater pebbles/rocks (matching frame_4s.png!)
      { x: 5.85, z: 2.15, r: 0.32, sy: 0.45, moss: 0.1 },
      { x: 6.45, z: 2.65, r: 0.24, sy: 0.40, moss: 0.0 },
      { x: 4.55, z: 3.95, r: 0.28, sy: 0.42, moss: 0.0 },
      { x: -5.85, z: 2.85, r: 0.35, sy: 0.48, moss: 0.1 },
      { x: -6.35, z: 3.45, r: 0.24, sy: 0.38, moss: 0.0 },
      { x: -3.25, z: 5.85, r: 0.38, sy: 0.42, moss: 0.0 },
      { x: -2.65, z: 6.35, r: 0.22, sy: 0.36, moss: 0.0 },
      { x: -4.45, z: 7.45, r: 0.36, sy: 0.40, moss: 0.0 },
      { x: 1.65, z: 5.65, r: 0.32, sy: 0.40, moss: 0.0 },
      { x: 0.85, z: 6.85, r: 0.25, sy: 0.36, moss: 0.0 },
      { x: -7.25, z: -1.45, r: 0.42, sy: 0.52, moss: 0.2 },
      { x: 6.75, z: -0.85, r: 0.38, sy: 0.50, moss: 0.2 },
      // Mid-mountain craggy rock faces behind Honden & below Pagoda
      { x: -1.25, z: -2.15, r: 0.78, sy: 1.15, moss: 0.75 },
      { x: -0.35, z: -2.45, r: 0.85, sy: 1.20, moss: 0.80 },
      { x: 0.65, z: -2.25, r: 0.82, sy: 1.18, moss: 0.75 },
      { x: 1.45, z: -1.95, r: 0.72, sy: 1.05, moss: 0.70 },
      { x: -2.05, z: -1.65, r: 0.68, sy: 0.95, moss: 0.65 }
    ];

    const boulderPos = [], boulderNorm = [], boulderCol = [], boulderIdx = [];
    let bVertOffset = 0;

    for (let rIdx = 0; rIdx < rockSpecs.length; rIdx++) {
      const spec = rockSpecs[rIdx];
      const baseH = getTerrainHeight(spec.x, spec.z);
      const sph = new THREE.IcosahedronGeometry(spec.r, 2);
      const pAttr = sph.attributes.position;
      const localPos = [];

      for (let i = 0; i < pAttr.count; i++) {
        let vx = pAttr.getX(i);
        let vy = pAttr.getY(i);
        let vz = pAttr.getZ(i);
        const n1 = fbm2((vx + spec.x) * 1.9, (vz + spec.z) * 1.9 + vy * 1.5, 3);
        const disp = 0.82 + 0.42 * n1;
        vx *= disp;
        vy *= disp * spec.sy;
        vz *= disp;
        if (vy < -spec.r * 0.45) vy = -spec.r * 0.45 + (vy + spec.r * 0.45) * 0.3;
        localPos.push(vx + spec.x, vy + baseH + spec.r * spec.sy * 0.22, vz + spec.z);
      }

      const tmpG = new THREE.BufferGeometry();
      tmpG.setAttribute('position', new THREE.Float32BufferAttribute(localPos, 3));
      tmpG.setIndex(Array.from(sph.index.array));
      tmpG.computeVertexNormals();
      const nAttr = tmpG.attributes.normal;

      for (let i = 0; i < pAttr.count; i++) {
        const wx = localPos[i * 3], wy = localPos[i * 3 + 1], wz = localPos[i * 3 + 2];
        const nx = nAttr.getX(i), ny = nAttr.getY(i), nz = nAttr.getZ(i);
        boulderPos.push(wx, wy, wz);
        boulderNorm.push(nx, ny, nz);

        const isMossy = spec.moss > 0.2 && ny > 0.52 && wy > 0.08;
        const shade = 0.85 + 0.25 * noise2D(wx * 3.5, wz * 3.5);
        const col = isMossy
          ? cCliffMid.clone().lerp(cMossMid, smoothstep(0.52, 0.82, ny) * spec.moss)
          : cCliffDark.clone().lerp(cCliffMid, 0.55);
        boulderCol.push(col.r * shade, col.g * shade, col.b * shade);
      }

      const idxArr = sph.index.array;
      for (let i = 0; i < idxArr.length; i++) {
        boulderIdx.push(bVertOffset + idxArr[i]);
      }
      bVertOffset += pAttr.count;
    }

    const boulderGeom = new THREE.BufferGeometry();
    boulderGeom.setAttribute('position', new THREE.Float32BufferAttribute(boulderPos, 3));
    boulderGeom.setAttribute('normal', new THREE.Float32BufferAttribute(boulderNorm, 3));
    boulderGeom.setAttribute('color', new THREE.Float32BufferAttribute(boulderCol, 3));
    boulderGeom.setIndex(boulderIdx);

    const boulderMesh = new THREE.Mesh(boulderGeom, new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.88,
      metalness: 0.05
    }));
    boulderMesh.castShadow = true;
    boulderMesh.receiveShadow = true;
    group.add(boulderMesh);

    return { group, perimPts, shadowPlaneMat };
  }

  window.ShrineTerrain = {
    DIORAMA_HALF,
    DIORAMA_CORNER,
    BASE_BOTTOM_Y,
    noise2D,
    fbm2,
    ridgedFbm2,
    smoothstep,
    sdRoundedBox2D,
    mapGridToRoundedSquare,
    getTerrainHeight,
    getTerrainNormal,
    buildIslandTerrainGroup
  };
})();


/**
 * water-and-shaders.js

 * Day/Night moonlight & warm lantern water reflections, FBM shoreline surf, and swimming Koi fish.

(function () {
  const WATER_SURFACE_VERT = `
    uniform float uTime;
    uniform float uWaterLevel;
    uniform float uWaveHeight;
    uniform float uWaveSpeed;

    attribute float aTerrainHeight;

    varying vec3 vWorldPos;
    varying float vTerrainHeight;
    varying float vWaveDisp;
    varying vec2 vUv;

    float waveFunc(vec2 p, float t) {
      float w1 = sin(p.x * 0.75 + p.y * 0.55 + t * 1.65) * 0.42;
      float w2 = cos(p.x * 0.45 - p.y * 0.88 + t * 1.25) * 0.35;
      float w3 = sin(p.x * 1.65 - p.y * 1.35 - t * 2.15) * 0.15;
      float w4 = cos(p.x * 2.40 + p.y * 2.10 + t * 2.80) * 0.08;
      return (w1 + w2 + w3 + w4);
    }

    void main() {
      vUv = uv;
      vTerrainHeight = aTerrainHeight;
      float rawDepth = max(0.0, uWaterLevel - aTerrainHeight);
      float shoreDamp = smoothstep(0.0, 0.35, rawDepth);

      float t = uTime * uWaveSpeed;
      float disp = waveFunc(position.xz, t) * uWaveHeight * shoreDamp;
      vWaveDisp = disp;

      vec3 displaced = vec3(position.x, uWaterLevel + disp, position.z);
      vec4 worldPos = modelMatrix * vec4(displaced, 1.0);
      vWorldPos = worldPos.xyz;
      gl_Position = projectionMatrix * viewMatrix * worldPos;
    }
  `;

  const WATER_SURFACE_FRAG = `
    uniform float uTime;
    uniform float uWaterLevel;
    uniform float uWaveHeight;
    uniform float uWaveSpeed;
    uniform float uClarity;
    uniform float uFoamIntensity;
    uniform float uNightMix;
    uniform vec3 uShallowColor;
    uniform vec3 uDeepColor;
    uniform vec3 uSkyColor;
    uniform vec3 uSunDir;
    uniform vec3 uSunColor;

    varying vec3 vWorldPos;
    varying float vTerrainHeight;
    varying float vWaveDisp;
    varying vec2 vUv;

    float hash21(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    float vnoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash21(i);
      float b = hash21(i + vec2(1.0, 0.0));
      float c = hash21(i + vec2(0.0, 1.0));
      float d = hash21(i + vec2(1.0, 1.0));

    float fbm(vec2 p) {

    void main() {

            rippleGrad += dir * cos(phase) * falloff * 0.12;
            float collar = smoothstep(0.18, 0.0, max(0.0, d - warp * 0.18)) * smoothstep(0.28, 0.65, n0);
            float wake = smoothstep(0.68, 0.95, ring) * smoothstep(0.95, 0.08, d) * smoothstep(0.35, 0.72, n0) * 0.38;
            pillarFoam = max(pillarFoam, collar * 0.85 + wake);

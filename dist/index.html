      vec3 waterCol = mix(uShallowColor, uDeepColor, clamp(depthFactor, 0.0, 1.0));

      float waveCrest = smoothstep(0.46, 0.78, n0);
      waterCol = mix(waterCol, uShallowColor * 1.12, waveCrest * 0.22);

      // 4. Fresnel Sky & Shrine Reflection
      float fresnel = pow(1.0 - max(dot(N, V), 0.0), 2.8);
      vec3 reflCol = mix(waterCol * 1.18, uSkyColor, 0.68);

      // Subtle warm vermilion reflection in water right in front of the O-Torii
      float toriiReflDist = length((xz - vec2(-1.65, 3.65)) * vec2(0.75, 0.85));
      if (toriiReflDist < 2.2) {
        float rMask = (1.0 - smoothstep(0.3, 2.2, toriiReflDist)) * (0.5 + 0.5 * sin(xz.x * 9.0 + n0 * 5.0));
        reflCol = mix(reflCol, vec3(0.84, 0.24, 0.16), rMask * (0.32 - uNightMix * 0.12));
      }

      vec3 surfaceCol = mix(waterCol, reflCol, clamp(fresnel * 0.68 + 0.10, 0.0, 0.80));

      // Nocturnal warm golden lantern & shrine reflections dancing on the water surface at night!
      if (uNightMix > 0.01) {
        float shimmer = 0.55 + 0.45 * sin(xz.x * 11.0 - xz.y * 9.0 + n0 * 7.0 + t * 2.8);
        float shrineGlowDist = length((xz - vec2(-0.65, 1.55)) * vec2(0.45, 0.55));
        float toriiGlowDist = length((xz - vec2(-1.65, 3.25)) * vec2(0.65, 0.65));
        float lanternMask = (1.0 - smoothstep(0.2, 2.4, shrineGlowDist)) * 0.65 +
                            (1.0 - smoothstep(0.1, 1.9, toriiGlowDist)) * 0.48;
        surfaceCol += vec3(1.0, 0.65, 0.24) * lanternMask * shimmer * uNightMix * 0.55;
      }

      // 5. Organic Shoreline Surf & Foam Gradient
      float foamNoise = fbm(xz * 4.2 + vec2(t * 0.38, -t * 0.32));
      float shoreLine = 1.0 - smoothstep(0.0, 0.16, depth - (foamNoise - 0.45) * 0.08);
      float surfRipple = sin(depth * 32.0 + t * 3.0 + foamNoise * 4.5);
      float secondarySurf = smoothstep(0.62, 0.94, surfRipple) * (1.0 - smoothstep(0.04, 0.36, depth)) * smoothstep(0.32, 0.68, foamNoise) * 0.52;
      float totalFoam = clamp((shoreLine * 0.82 + secondarySurf + pillarFoam) * uFoamIntensity, 0.0, 1.0);

      vec3 dayFoamCol = mix(vec3(0.95, 0.98, 0.98), uSunColor, 0.16);
      vec3 nightFoamCol = vec3(0.48, 0.72, 0.86);
      vec3 foamColor = mix(dayFoamCol, nightFoamCol, uNightMix * 0.68);
      surfaceCol = mix(surfaceCol, foamColor, totalFoam);

      // 6. Sun / Moon Specular Sparkle
      vec3 H = normalize(L + V);
      float spec1 = pow(max(dot(N, H), 0.0), 120.0) * 0.78;
      float spec2 = pow(max(dot(N, H), 0.0), 24.0) * 0.15;
      surfaceCol += uSunColor * (spec1 + spec2);

      // 7. Glassy meniscus highlight right along the outer rounded-square rim
      float edgeX = abs(xz.x) - (11.0 - 2.0);
      float edgeZ = abs(xz.y) - (11.0 - 2.0);
      float sdEdge = length(max(vec2(edgeX, edgeZ), 0.0)) + min(max(edgeX, edgeZ), 0.0) - 2.0;
      float rimHighlight = smoothstep(-0.24, 0.0, sdEdge);
      vec3 rimCol = mix(uShallowColor, mix(vec3(1.0), vec3(0.55, 0.82, 0.95), uNightMix), 0.55);
      surfaceCol = mix(surfaceCol, rimCol, rimHighlight * 0.48);

      // 8. Alpha / Transparency
      float baseAlpha = mix(0.46, 0.84, clamp(depthFactor * 0.88 + fresnel * 0.32, 0.0, 1.0));
      float edgeFade = smoothstep(-0.008, 0.025, waterDepth);
      float finalAlpha = clamp(mix(baseAlpha, 0.94, totalFoam) * edgeFade, 0.0, 0.95);

      gl_FragColor = vec4(surfaceCol, finalAlpha);
    }
  `;

  const WATER_SIDE_VERT = `
    uniform float uTime;
    uniform float uWaterLevel;
    uniform float uWaveHeight;
    uniform float uWaveSpeed;

    attribute float aTerrainHeight;

    varying vec3 vWorldPos;
    varying vec3 vWorldNormal;
    varying vec2 vUv;
    varying float vDepthRatio;

    float waveFunc(vec2 p, float t) {
      float w1 = sin(p.x * 0.75 + p.y * 0.55 + t * 1.65) * 0.42;
      float w2 = cos(p.x * 0.45 - p.y * 0.88 + t * 1.25) * 0.35;
      return (w1 + w2);
    }

    void main() {
      vUv = uv;
      float t = uTime * uWaveSpeed;
      float rawDepth = max(0.0, uWaterLevel - aTerrainHeight);
      float disp = waveFunc(position.xz, t) * uWaveHeight * smoothstep(0.0, 0.35, rawDepth);

      float topY = max(aTerrainHeight, uWaterLevel + disp);
      float botY = min(aTerrainHeight, topY);
      float curY = mix(botY, topY, uv.y);

      vDepthRatio = 1.0 - uv.y;
      vec3 pos = vec3(position.x, curY, position.z);
      vec4 worldPos = modelMatrix * vec4(pos, 1.0);
      vWorldPos = worldPos.xyz;
      vWorldNormal = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * worldPos;
    }
  `;

  const WATER_SIDE_FRAG = `
    uniform float uTime;
    uniform float uNightMix;
    uniform vec3 uShallowColor;
    uniform vec3 uDeepColor;
    uniform vec3 uSunDir;
    uniform vec3 uSunColor;

    varying vec3 vWorldPos;
    varying vec3 vWorldNormal;
    varying vec2 vUv;
    varying float vDepthRatio;

    void main() {
      vec3 N = normalize(vWorldNormal);
      vec3 V = normalize(cameraPosition - vWorldPos);
      vec3 L = normalize(uSunDir);

      vec3 col = mix(uShallowColor * 0.92, uDeepColor * 0.82, pow(vDepthRatio, 0.85));

      float rayCoord = (vWorldPos.x + vWorldPos.z) * 1.35 + vWorldPos.y * 0.9 - uTime * 0.45;
      float rays = pow(0.5 + 0.5 * sin(rayCoord) * cos(rayCoord * 0.65), 3.0);
      col += uShallowColor * rays * 0.14 * (1.0 - vDepthRatio * 0.6);

      float ndl = max(dot(N, L), 0.0) * 0.32 + 0.68;
      col *= ndl;

      float fresnel = pow(1.0 - max(dot(N, V), 0.0), 2.5);
      col += mix(vec3(0.85, 0.96, 0.98), vec3(0.45, 0.72, 0.92), uNightMix) * fresnel * 0.20;

      float topMeniscus = smoothstep(0.89, 1.0, vUv.y);
      vec3 meniscusTarget = mix(vec3(1.0), vec3(0.55, 0.85, 0.96), uNightMix * 0.7);
      col = mix(col, mix(uShallowColor, meniscusTarget, 0.62), topMeniscus * 0.65);

      float bottomAO = smoothstep(0.0, 0.14, vUv.y);
      col *= (0.78 + 0.22 * bottomAO);

      float alpha = mix(0.80, 0.92, vDepthRatio);
      gl_FragColor = vec4(col, alpha);
    }
  `;

  function buildOceanWaterSystem(THREE, terrainHelper, perimPts) {
    const group = new THREE.Group();
    group.name = 'OceanWaterGroup';

    const obstaclePositions = [
      new THREE.Vector3(-2.65, 3.05, 0.18),
      new THREE.Vector3(-0.65, 3.65, 0.18),
      new THREE.Vector3(-2.85, 3.65, 0.12),
      new THREE.Vector3(-2.45, 2.45, 0.12),
      new THREE.Vector3(-0.85, 4.25, 0.12),
      new THREE.Vector3(-0.45, 3.05, 0.12),
      new THREE.Vector3(-4.25, 0.55, 0.85),
      new THREE.Vector3(2.75, 1.95, 0.95),
      new THREE.Vector3(-2.85, 1.85, 0.20),
      new THREE.Vector3(1.15, 2.55, 0.20)
    ];

    const sharedUniforms = {
      uTime: { value: 0.0 },
      uWaterLevel: { value: 0.0 },
      uWaveHeight: { value: 0.048 },
      uWaveSpeed: { value: 1.0 },
      uClarity: { value: 1.15 },
      uFoamIntensity: { value: 0.88 },
      uNightMix: { value: 0.0 },
      uShallowColor: { value: new THREE.Color('#5ee0d4') },
      uDeepColor: { value: new THREE.Color('#096575') },
      uSkyColor: { value: new THREE.Color('#f4efe6') },
      uSunDir: { value: new THREE.Vector3(14, 22, 12).normalize() },
      uSunColor: { value: new THREE.Color('#fff7e8') },
      uObstaclePos: { value: obstaclePositions }
    };

    const segs = 144;
    const segs1 = segs + 1;
    const wPos = [], wNorm = [], wUv = [], wTerrH = [], wIdx = [];

    for (let iz = 0; iz <= segs; iz++) {
      const v = (iz / segs) * 2 - 1;
      for (let ix = 0; ix <= segs; ix++) {
        const u = (ix / segs) * 2 - 1;
        const pt = terrainHelper.mapGridToRoundedSquare(u, v);
        const th = terrainHelper.getTerrainHeight(pt.x, pt.z);
        wPos.push(pt.x, 0, pt.z);
        wNorm.push(0, 1, 0);
        wUv.push(ix / segs, iz / segs);
        wTerrH.push(th);
      }
    }
    for (let iz = 0; iz < segs; iz++) {
      for (let ix = 0; ix < segs; ix++) {
        const a = iz * segs1 + ix;
        const b = (iz + 1) * segs1 + ix;
        const c = (iz + 1) * segs1 + (ix + 1);
        const d = iz * segs1 + (ix + 1);
        wIdx.push(a, b, d, b, c, d);
      }
    }

    const waterSurfGeom = new THREE.BufferGeometry();
    waterSurfGeom.setAttribute('position', new THREE.Float32BufferAttribute(wPos, 3));
    waterSurfGeom.setAttribute('normal', new THREE.Float32BufferAttribute(wNorm, 3));
    waterSurfGeom.setAttribute('uv', new THREE.Float32BufferAttribute(wUv, 2));
    waterSurfGeom.setAttribute('aTerrainHeight', new THREE.Float32BufferAttribute(wTerrH, 1));
    waterSurfGeom.setIndex(wIdx);

    const waterSurfMat = new THREE.ShaderMaterial({
      uniforms: sharedUniforms,
      vertexShader: WATER_SURFACE_VERT,
      fragmentShader: WATER_SURFACE_FRAG,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide
    });

    const waterSurfMesh = new THREE.Mesh(waterSurfGeom, waterSurfMat);
    waterSurfMesh.renderOrder = 2;
    waterSurfMesh.name = 'WaterSurfaceMesh';
    group.add(waterSurfMesh);

    const sPos = [], sNorm = [], sUv = [], sTerrH = [], sIdx = [];
    const pCount = perimPts.length;

    for (let i = 0; i <= pCount; i++) {
      const pt = perimPts[i % pCount];
      const nextPt = perimPts[(i + 1) % pCount];
      const prevPt = perimPts[(i - 1 + pCount) % pCount];
      const tx = nextPt.x - prevPt.x, tz = nextPt.z - prevPt.z;
      const tLen = Math.hypot(tx, tz) || 1;
      const nx = tz / tLen, nz = -tx / tLen;
      const th = terrainHelper.getTerrainHeight(pt.x, pt.z);
      const uCoord = i / pCount;

      sPos.push(pt.x, 0, pt.z);
      sNorm.push(nx, 0, nz);
      sUv.push(uCoord, 1.0);
      sTerrH.push(th);

      sPos.push(pt.x, th, pt.z);
      sNorm.push(nx, 0, nz);
      sUv.push(uCoord, 0.0);
      sTerrH.push(th);
    }

    for (let i = 0; i < pCount; i++) {
      const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2 + 1, d = (i + 1) * 2;
      sIdx.push(a, d, b, b, d, c);
    }

    const waterSideGeom = new THREE.BufferGeometry();
    waterSideGeom.setAttribute('position', new THREE.Float32BufferAttribute(sPos, 3));
    waterSideGeom.setAttribute('normal', new THREE.Float32BufferAttribute(sNorm, 3));
    waterSideGeom.setAttribute('uv', new THREE.Float32BufferAttribute(sUv, 2));
    waterSideGeom.setAttribute('aTerrainHeight', new THREE.Float32BufferAttribute(sTerrH, 1));
    waterSideGeom.setIndex(sIdx);

    const waterSideMat = new THREE.ShaderMaterial({
      uniforms: sharedUniforms,
      vertexShader: WATER_SIDE_VERT,
      fragmentShader: WATER_SIDE_FRAG,
      transparent: true,
      depthWrite: false,
      side: THREE.FrontSide
    });

    const waterSideMesh = new THREE.Mesh(waterSideGeom, waterSideMat);
    waterSideMesh.renderOrder = 3;
    waterSideMesh.name = 'WaterSideMesh';
    group.add(waterSideMesh);

    const fishGroup = new THREE.Group();
    fishGroup.name = 'SwimmingFishGroup';
    const fishData = [
      { cx: -2.4, cz: 5.2, rx: 1.4, rz: 0.9, speed: 0.55, phase: 0.0, col: '#f56a3f', col2: '#ffffff' },
      { cx: -0.2, cz: 5.8, rx: 1.6, rz: 1.1, speed: 0.48, phase: 2.1, col: '#ffffff', col2: '#e3422b' },
      { cx: -4.8, cz: 4.5, rx: 1.2, rz: 1.3, speed: 0.62, phase: 4.2, col: '#f7a13e', col2: '#fff5e4' },
      { cx: 2.4, cz: 5.4, rx: 1.5, rz: 1.0, speed: 0.52, phase: 1.3, col: '#e84830', col2: '#ffffff' },
      { cx: -6.2, cz: 1.8, rx: 1.1, rz: 1.4, speed: 0.58, phase: 3.5, col: '#ffffff', col2: '#f06438' },
      { cx: 5.2, cz: 3.8, rx: 1.3, rz: 1.1, speed: 0.50, phase: 5.1, col: '#f5823b', col2: '#ffffff' }
    ];

    const fishInstances = [];
    for (let i = 0; i < fishData.length; i++) {
      const fd = fishData[i];
      const fHolder = new THREE.Group();
      const bodyGeom = new THREE.ConeGeometry(0.065, 0.28, 8);
      const bPos = bodyGeom.attributes.position;
      const bCol = [];
      const cPrimary = new THREE.Color(fd.col);
      const cSecondary = new THREE.Color(fd.col2);
      for (let k = 0; k < bPos.count; k++) {
        const vx = bPos.getX(k), vy = bPos.getY(k), vz = bPos.getZ(k);
        bPos.setXYZ(k, vx * 0.65, vz * 0.85, -vy);
        const spot = (vy > -0.02 && vx > -0.02) ? cPrimary : cSecondary;
        bCol.push(spot.r, spot.g, spot.b);
      }
      bodyGeom.computeVertexNormals();
      bodyGeom.setAttribute('color', new THREE.Float32BufferAttribute(bCol, 3));
      const fMesh = new THREE.Mesh(bodyGeom, new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.35
      }));
      fHolder.add(fMesh);
      fishGroup.add(fHolder);
      fishInstances.push({ holder: fHolder, mesh: fMesh, data: fd });
    }
    group.add(fishGroup);

    function updateWater(elapsedTime) {
      sharedUniforms.uTime.value = elapsedTime;
      const wl = sharedUniforms.uWaterLevel.value;
      for (let i = 0; i < fishInstances.length; i++) {
        const fi = fishInstances[i];
        const d = fi.data;
        const ang = elapsedTime * d.speed + d.phase;
        const fx = d.cx + Math.cos(ang) * d.rx;
        const fz = d.cz + Math.sin(ang * 1.5) * d.rz;
        const th = terrainHelper.getTerrainHeight(fx, fz);
        const targetY = Math.min(wl - 0.10, Math.max(th + 0.08, wl - 0.22));
        fi.holder.visible = (wl - th) > 0.16;
        fi.holder.position.set(fx, targetY, fz);

        const dx = -Math.sin(ang) * d.rx * d.speed;
        const dz = Math.cos(ang * 1.5) * 1.5 * d.rz * d.speed;
        const yaw = Math.atan2(dx, dz) + Math.sin(elapsedTime * 8.0 + d.phase) * 0.08;
        fi.holder.rotation.set(0, yaw, 0);
      }
    }

    return {
      group,
      uniforms: sharedUniforms,
      waterSurfMesh,
      waterSideMesh,
      updateWater
    };
  }

  window.ShrineWater = {
    WATER_SURFACE_VERT,
    WATER_SURFACE_FRAG,
    WATER_SIDE_VERT,
    WATER_SIDE_FRAG,
    buildOceanWaterSystem
  };
})();


/**
 * shrine-architecture.js
 * Handcrafted Procedural Japanese Shrine Architecture:
 * 1. Grand Ryobu O-Torii Gate (4-legged Miyajima style in shallow lagoon)
 * 2. Floating Shrine Complex (Haiden Worship Hall, Honden Main Sanctuary, Hirabutai/Takabutai Stage,
 *    Left & Right Kairo Covered Corridors on wooden stilts, Soribashi Arched Bridge)
 * 3. Five-Story Pagoda (Goju-no-To on the upper left mountain shoulder)
 * 4. Secondary Mountain Torii Gates, Winding Stone Stairway, and 10 Glowing Stone Lanterns (Toro)
 */
(function () {
  function createMaterials(THREE) {
    return {
      vermilion: new THREE.MeshStandardMaterial({ color: '#c8281c', roughness: 0.36, metalness: 0.08 }),
      vermilionDark: new THREE.MeshStandardMaterial({ color: '#9a1c13', roughness: 0.44, metalness: 0.08 }),
      roofSlate: new THREE.MeshStandardMaterial({ color: '#272529', roughness: 0.62, metalness: 0.14 }),
      roofBark: new THREE.MeshStandardMaterial({ color: '#332926', roughness: 0.72, metalness: 0.06 }),
      woodCypress: new THREE.MeshStandardMaterial({ color: '#b58858', roughness: 0.68, metalness: 0.04 }),
      woodAged: new THREE.MeshStandardMaterial({ color: '#705338', roughness: 0.78, metalness: 0.04 }),
      woodDark: new THREE.MeshStandardMaterial({ color: '#2b221c', roughness: 0.80, metalness: 0.05 }),
      plasterWhite: new THREE.MeshStandardMaterial({ color: '#f3eee4', roughness: 0.74, metalness: 0.02 }),
      goldTrim: new THREE.MeshStandardMaterial({ color: '#dfb14b', roughness: 0.26, metalness: 0.75 }),
      plaqueNavy: new THREE.MeshStandardMaterial({ color: '#182438', roughness: 0.40, metalness: 0.20 }),
      stoneGranite: new THREE.MeshStandardMaterial({ color: '#8b8d86', roughness: 0.85, metalness: 0.04 }),
      stoneDark: new THREE.MeshStandardMaterial({ color: '#5c5f58', roughness: 0.88, metalness: 0.04 }),
      lanternGlow: new THREE.MeshStandardMaterial({
        color: '#ffdf9e',
        emissive: '#ffaa3b',
        emissiveIntensity: 1.35,
        roughness: 0.25
      }),
      shojiWindow: new THREE.MeshStandardMaterial({
        color: '#f3eee4',
        emissive: '#ff9d33',
        emissiveIntensity: 0.05,
        roughness: 0.55
      }),
      fireflyGlow: new THREE.MeshBasicMaterial({
        color: '#ffe28a',
        transparent: true,
        opacity: 0.0
      })
    };
  }

  function addBox(THREE, parent, w, h, d, mat, x, y, z, rx = 0, ry = 0, rz = 0, cast = true) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z);
    if (rx || ry || rz) m.rotation.set(rx, ry, rz);
    m.castShadow = cast;
    m.receiveShadow = true;
    parent.add(m);
    return m;
  }

  function addCyl(THREE, parent, rt, rb, h, segs, mat, x, y, z, rx = 0, ry = 0, rz = 0, cast = true) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, segs), mat);
    m.position.set(x, y, z);
    if (rx || ry || rz) m.rotation.set(rx, ry, rz);
    m.castShadow = cast;
    m.receiveShadow = true;
    parent.add(m);
    return m;
  }

  /**
   * Builds a traditional curved Japanese roof (Sori 反り) with upturned eaves,
   * ridge beam (mune), and optional gable (irimoya) panels.
   */
  function buildCurvedRoof(THREE, w, h, d, mats, opts = {}) {
    const group = new THREE.Group();
    const segX = 16, segZ = 12;
    const geom = new THREE.BoxGeometry(w, opts.thickness || 0.12, d, segX, 1, segZ);
    const pos = geom.attributes.position;

    const isGabled = opts.irimoya !== false;
    const curveLift = opts.curveLift ?? 0.24;

    for (let i = 0; i < pos.count; i++) {
      let vx = pos.getX(i);
      let vy = pos.getY(i);
      let vz = pos.getZ(i);

      const nx = vx / (w * 0.5); // -1 .. 1
      const nz = vz / (d * 0.5); // -1 .. 1
      const ax = Math.abs(nx), az = Math.abs(nz);

      // Parabolic hip-and-gable (Irimoya) roof profile with sweeping concave eaves (sori)
      let pitch;
      if (isGabled) {
        const hipZ = Math.max(0, 1.0 - az);
        const hipX = Math.max(0, 1.0 - Math.max(0, ax - 0.38) / 0.62);
        pitch = Math.pow(hipZ, 0.78) * Math.pow(hipX, 0.65) * h;
      } else {
        // Pyramid/Pagoda style 4-sided curved roof
        const edgeDist = Math.max(ax, az);
        pitch = Math.pow(Math.max(0, 1.0 - edgeDist), 0.72) * h;
      }

      // Upturned corner eaves (warabi-te / sori curve)
      const rCorner = Math.hypot(nx, nz);
      const cornerFlare = Math.pow(Math.max(0, rCorner - 0.65) / 0.76, 2.0) * curveLift;

      // Slight flare outward at bottom eaves
      if (vy < 0) {
        vx *= 1.025;
        vz *= 1.025;
      }
      pos.setXYZ(i, vx, vy + pitch + cornerFlare, vz);
    }
    geom.computeVertexNormals();

    const roofMat = opts.useSlate ? mats.roofSlate : mats.roofBark;
    const roofMesh = new THREE.Mesh(geom, roofMat);
    roofMesh.castShadow = true;
    roofMesh.receiveShadow = true;
    group.add(roofMesh);

    // Top main ridge beam (O-mune) + gold end caps (Onigawara)
    if (isGabled) {
      const ridgeW = w * 0.52;
      addBox(THREE, group, ridgeW, 0.16, 0.18, mats.roofSlate, 0, h + 0.06, 0);
      addBox(THREE, group, ridgeW + 0.08, 0.05, 0.21, mats.goldTrim, 0, h + 0.15, 0);
      addBox(THREE, group, 0.10, 0.22, 0.22, mats.goldTrim, -ridgeW * 0.5, h + 0.10, 0);
      addBox(THREE, group, 0.10, 0.22, 0.22, mats.goldTrim, ridgeW * 0.5, h + 0.10, 0);

      // White triangular irimoya gable walls (Tsuma) on left and right
      addBox(THREE, group, 0.08, h * 0.42, d * 0.34, mats.plasterWhite, -w * 0.22, h * 0.52, 0);
      addBox(THREE, group, 0.08, h * 0.42, d * 0.34, mats.plasterWhite, w * 0.22, h * 0.52, 0);

      // Optional Chigi (forked roof finials) & Katsuogi (horizontal billets) for Honden
      if (opts.sacredFinials) {
        for (const side of [-1, 1]) {
          const cx = side * (ridgeW * 0.42);
          addBox(THREE, group, 0.05, 0.55, 0.05, mats.goldTrim, cx, h + 0.28, 0.08, 0.42, 0, side * -0.15);
          addBox(THREE, group, 0.05, 0.55, 0.05, mats.goldTrim, cx, h + 0.28, -0.08, -0.42, 0, side * -0.15);
        }
        for (let k = -2; k <= 2; k++) {
          addCyl(THREE, group, 0.045, 0.045, 0.32, 8, mats.goldTrim, k * (ridgeW * 0.16), h + 0.19, 0, Math.PI / 2, 0, 0);
        }
      }
    }

    return group;
  }

  /**
   * 1. Grand Ryobu O-Torii Gate (大鳥居 — 4-legged Miyajima style standing in shallow water)
   */
  function buildRyobuTorii(THREE, mats) {
    const torii = new THREE.Group();
    torii.name = 'GrandRyobuTorii';

    const span = 2.12; // Distance between main pillars
    const halfSpan = span * 0.5;
    const pillarH = 2.68;

    // Two Main Vermilion Pillars (Oyabashira) + Black Submerged Base Sleeves (Nemaki)
    for (const side of [-1, 1]) {
      const px = side * halfSpan;
      // Slight inward inclination (korobi)
      const tilt = side * 0.025;
      addCyl(THREE, torii, 0.125, 0.148, pillarH, 16, mats.vermilion, px, pillarH * 0.5, 0, 0, 0, tilt);
      // Black base sleeve
      addCyl(THREE, torii, 0.156, 0.168, 0.62, 16, mats.roofSlate, px, 0.31, 0, 0, 0, tilt);

      // Four Outrigger Support Pillars (Chigo-bashira — front and back of each main pillar)
      const outZ = 0.64;
      const outH = 1.72;
      for (const zDir of [-1, 1]) {
        const oz = zDir * outZ;
        const ox = px + side * 0.04;
        addCyl(THREE, torii, 0.078, 0.092, outH, 12, mats.vermilion, ox, outH * 0.5, oz);
        addCyl(THREE, torii, 0.098, 0.106, 0.48, 12, mats.roofSlate, ox, 0.24, oz);
        // Outrigger dark pitched cap
        addBox(THREE, torii, 0.22, 0.07, 0.22, mats.roofSlate, ox, outH + 0.03, oz);
      }

      // Cross-tie beams (Hikae-nuki) connecting front & back outriggers through the main pillar
      addBox(THREE, torii, 0.10, 0.11, outZ * 2.35, mats.vermilion, px, 1.24, 0);
      addBox(THREE, torii, 0.09, 0.09, outZ * 2.25, mats.vermilion, px, 0.72, 0);
      // Small protective dark shingle rooflet over the upper outrigger crossbeam
      addBox(THREE, torii, 0.24, 0.05, outZ * 2.45, mats.roofSlate, px, 1.32, 0);
    }

    // Lower Tie Beam (Nuki) + Wedge Stoppers (Kusabi)
    const nukiW = span + 1.18;
    addBox(THREE, torii, nukiW, 0.16, 0.13, mats.vermilion, 0, 2.08, 0);
    for (const side of [-1, 1]) {
      addBox(THREE, torii, 0.32, 0.22, 0.16, mats.vermilionDark, side * halfSpan, 2.08, 0);
    }

    // Sweeping Curved Top Lintel (Kasagi + Shimaki) with Dark Roof Cap & Gold End Finials
    const kasagiW = span + 1.68;
    const segs = 20;
    const shimakiGeom = new THREE.BoxGeometry(kasagiW, 0.15, 0.22, segs, 1, 1);
    const kasagiGeom = new THREE.BoxGeometry(kasagiW + 0.18, 0.14, 0.30, segs, 1, 2);

    const bendBeam = (geom, lift) => {
      const p = geom.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const vx = p.getX(i), vy = p.getY(i), vz = p.getZ(i);
        const u = Math.abs(vx) / (kasagiW * 0.5);
        const curve = Math.pow(u, 2.35) * lift;
        // Flare tips slightly
        const tipScale = 1.0 + Math.pow(u, 3.0) * 0.18;
        p.setXYZ(i, vx, vy + curve, vz * tipScale);
      }
      geom.computeVertexNormals();
    };
    bendBeam(shimakiGeom, 0.24);
    bendBeam(kasagiGeom, 0.27);

    const shimakiMesh = new THREE.Mesh(shimakiGeom, mats.vermilion);
    shimakiMesh.position.set(0, 2.58, 0);
    shimakiMesh.castShadow = true;
    torii.add(shimakiMesh);

    const kasagiMesh = new THREE.Mesh(kasagiGeom, mats.roofSlate);
    kasagiMesh.position.set(0, 2.72, 0);
    kasagiMesh.castShadow = true;
    torii.add(kasagiMesh);

    // Gold decorative end caps on the Kasagi/Shimaki tips
    for (const side of [-1, 1]) {
      addBox(THREE, torii, 0.08, 0.16, 0.24, mats.goldTrim, side * (kasagiW * 0.5 + 0.02), 2.83, 0, 0, 0, side * 0.24);
    }

    // Central Strut (Gakuzuka) & Calligraphy Plaque (Hengaku)
    addBox(THREE, torii, 0.14, 0.50, 0.12, mats.vermilion, 0, 2.33, 0);
    addBox(THREE, torii, 0.34, 0.44, 0.06, mats.goldTrim, 0, 2.34, 0.06);
    addBox(THREE, torii, 0.28, 0.38, 0.07, mats.plaqueNavy, 0, 2.34, 0.062);
    // Gold vertical calligraphy strokes on plaque
    addBox(THREE, torii, 0.04, 0.26, 0.075, mats.goldTrim, 0, 2.34, 0.065);

    return torii;
  }

  /**
   * Smaller Myojin Torii Gate for mountain path & side entrance
   */
  function buildSmallTorii(THREE, mats, scale = 1.0) {
    const g = new THREE.Group();
    const span = 1.15 * scale;
    const h = 1.48 * scale;
    for (const s of [-1, 1]) {
      addCyl(THREE, g, 0.055 * scale, 0.068 * scale, h, 10, mats.vermilion, s * span * 0.5, h * 0.5, 0);
      addCyl(THREE, g, 0.072 * scale, 0.078 * scale, 0.25 * scale, 10, mats.roofSlate, s * span * 0.5, 0.125 * scale, 0);
    }
    addBox(THREE, g, span + 0.45 * scale, 0.08 * scale, 0.07 * scale, mats.vermilion, 0, h * 0.78, 0);
    addBox(THREE, g, span + 0.62 * scale, 0.08 * scale, 0.12 * scale, mats.vermilion, 0, h * 0.96, 0);
    addBox(THREE, g, span + 0.72 * scale, 0.07 * scale, 0.16 * scale, mats.roofSlate, 0, h * 1.02, 0);
    addBox(THREE, g, 0.07 * scale, 0.18 * scale, 0.06 * scale, mats.vermilion, 0, h * 0.87, 0);
    return g;
  }

  /**
   * Traditional Japanese Stone Lantern (Toro 石灯籠) with warm glowing light
   */
  function buildStoneLantern(THREE, mats, scale = 1.0) {
    const g = new THREE.Group();
    // Base (Kiso) & Shaft (Sao)
    addBox(THREE, g, 0.34 * scale, 0.10 * scale, 0.34 * scale, mats.stoneDark, 0, 0.05 * scale, 0);
    addCyl(THREE, g, 0.075 * scale, 0.095 * scale, 0.36 * scale, 8, mats.stoneGranite, 0, 0.28 * scale, 0);
    // Middle platform (Chudai)
    addBox(THREE, g, 0.28 * scale, 0.07 * scale, 0.28 * scale, mats.stoneGranite, 0, 0.48 * scale, 0);
    // Firebox (Hibukuro) — glowing warm paper window
    addBox(THREE, g, 0.18 * scale, 0.18 * scale, 0.18 * scale, mats.lanternGlow, 0, 0.60 * scale, 0, 0, 0, 0, false);
    // Corner mullions of firebox
    for (const sx of [-1, 1]) {
      for (const sz of [-1, 1]) {
        addBox(THREE, g, 0.03 * scale, 0.19 * scale, 0.03 * scale, mats.stoneDark, sx * 0.085 * scale, 0.60 * scale, sz * 0.085 * scale);
      }
    }
    // Curved hexagonal/square umbrella roof (Kasa) + Finial (Hoju)
    const roof = buildCurvedRoof(THREE, 0.46 * scale, 0.15 * scale, 0.46 * scale, mats, {
      irimoya: false,
      useSlate: true,
      thickness: 0.05 * scale,
      curveLift: 0.06 * scale
    });
    roof.position.set(0, 0.70 * scale, 0);
    g.add(roof);
    addCyl(THREE, g, 0.01 * scale, 0.05 * scale, 0.12 * scale, 8, mats.stoneGranite, 0, 0.89 * scale, 0);
    return g;
  }

  /**
   * 2. Five-Story Pagoda (Goju-no-To 五重塔) perched on the upper-left mountain terrace
   */
  function buildFiveStoryPagoda(THREE, mats) {
    const pagoda = new THREE.Group();
    pagoda.name = 'FiveStoryPagoda';

    // Stone podium foundation (Kidan)
    addBox(THREE, pagoda, 1.95, 0.45, 1.95, mats.stoneGranite, 0, 0.12, 0);
    addBox(THREE, pagoda, 1.78, 0.16, 1.78, mats.stoneDark, 0, 0.40, 0);
    // Front stone steps
    for (let s = 0; s < 3; s++) {
      addBox(THREE, pagoda, 0.52, 0.12, 0.22, mats.stoneGranite, 0, 0.08 + s * 0.12, 0.98 - s * 0.08);
    }

    let curY = 0.48;
    for (let tier = 0; tier < 5; tier++) {
      const taper = 1.0 - tier * 0.115;
      const coreW = 1.18 * taper;
      const storyH = (tier === 0 ? 0.62 : 0.48) * (1.0 - tier * 0.04);
      const roofW = 1.92 * taper;
      const roofH = 0.34 * taper;

      // Shoji/plaster wall core that illuminates warmly at night
      addBox(THREE, pagoda, coreW, storyH, coreW, mats.shojiWindow, 0, curY + storyH * 0.5, 0);

      // Vermilion corner & center structural columns + horizontal beams
      const halfC = coreW * 0.5 + 0.015;
      for (const sx of [-1, 0, 1]) {
        for (const sz of [-1, 0, 1]) {
          if (sx === 0 && sz === 0) continue;
          addBox(THREE, pagoda, 0.055, storyH, 0.055, mats.vermilion, sx * halfC, curY + storyH * 0.5, sz * halfC);
        }
      }

      // Wrap-around wooden balcony & vermilion railing (Kouran)
      const balW = coreW + 0.28 * taper;
      addBox(THREE, pagoda, balW, 0.05, balW, mats.woodCypress, 0, curY + 0.03, 0);
      addBox(THREE, pagoda, balW + 0.04, 0.11, balW + 0.04, mats.vermilionDark, 0, curY + 0.09, 0);

      // Multi-tiered bracket complex (Tokiyo) under eaves
      addBox(THREE, pagoda, coreW + 0.22 * taper, 0.09, coreW + 0.22 * taper, mats.vermilion, 0, curY + storyH - 0.03, 0);

      // Curved Pagoda Roof with upturned corners
      const roof = buildCurvedRoof(THREE, roofW, roofH, roofW, mats, {
        irimoya: false,
        useSlate: true,
        thickness: 0.08,
        curveLift: 0.16 * taper
      });
      roof.position.set(0, curY + storyH + 0.02, 0);
      pagoda.add(roof);

      curY += storyH + roofH * 0.76;
    }

    // Ornate Bronze/Gold Spire (Sorin 相輪) with 9 rings (Kurin)
    addBox(THREE, pagoda, 0.26, 0.12, 0.26, mats.roofSlate, 0, curY + 0.04, 0);
    addCyl(THREE, pagoda, 0.022, 0.052, 1.15, 10, mats.goldTrim, 0, curY + 0.62, 0);
    for (let r = 0; r < 7; r++) {
      const ry = curY + 0.22 + r * 0.095;
      const rad = 0.095 * (1.0 - r * 0.07);
      addCyl(THREE, pagoda, rad, rad, 0.025, 10, mats.goldTrim, 0, ry, 0);
    }
    // Top jewel finial (Hoju)
    addCyl(THREE, pagoda, 0.005, 0.055, 0.18, 8, mats.goldTrim, 0, curY + 1.18, 0);

    return pagoda;
  }

  /**
   * Helper: Builds a pier-supported deck with wooden pilings (stilt posts) & vermilion railings
   */
  function buildStiltedDeck(THREE, parent, cx, cy, cz, w, d, mats, opts = {}) {
    const g = new THREE.Group();
    g.position.set(cx, cy, cz);
    if (opts.ry) g.rotation.y = opts.ry;

    // Main weathered cypress plank deck + dark sub-beams
    addBox(THREE, g, w, 0.09, d, mats.woodCypress, 0, 0, 0);
    addBox(THREE, g, w + 0.06, 0.06, d + 0.06, mats.woodAged, 0, -0.06, 0);

    // Supporting wooden stilts extending down into the seabed
    const nx = Math.max(2, Math.round(w / 0.85) + 1);
    const nz = Math.max(2, Math.round(d / 0.85) + 1);
    const stiltH = 1.25;
    for (let ix = 0; ix < nx; ix++) {
      for (let iz = 0; iz < nz; iz++) {
        // Place stilts around perimeter and key interior intersections
        if (ix > 0 && ix < nx - 1 && iz > 0 && iz < nz - 1) continue;
        const sx = -w * 0.46 + (ix / (nx - 1)) * (w * 0.92);
        const sz = -d * 0.46 + (iz / (nz - 1)) * (d * 0.92);
        addCyl(THREE, g, 0.048, 0.055, stiltH, 8, mats.woodAged, sx, -stiltH * 0.5, sz);
        addCyl(THREE, g, 0.058, 0.064, 0.45, 8, mats.woodDark, sx, -stiltH + 0.22, sz);
      }
    }

    // Perimeter Vermilion Railings (Kouran) with Giboshi post caps
    const rH = 0.24;
    const sides = opts.railingSides || ['front', 'left', 'right'];
    const addRailEdge = (x1, z1, x2, z2) => {
      const len = Math.hypot(x2 - x1, z2 - z1);
      const mx = (x1 + x2) * 0.5, mz = (z1 + z2) * 0.5;
      const ang = Math.atan2(x2 - x1, z2 - z1);
      // Top & middle horizontal rails
      addBox(THREE, g, 0.045, 0.045, len + 0.04, mats.vermilion, mx, rH, mz, 0, ang, 0);
      addBox(THREE, g, 0.035, 0.035, len, mats.vermilionDark, mx, rH * 0.52, mz, 0, ang, 0);
      const postCount = Math.max(2, Math.round(len / 0.65) + 1);
      for (let p = 0; p < postCount; p++) {
        const t = p / (postCount - 1);
        const px = x1 + (x2 - x1) * t;
        const pz = z1 + (z2 - z1) * t;
        addBox(THREE, g, 0.055, rH + 0.05, 0.055, mats.vermilion, px, rH * 0.5, pz);
        addBox(THREE, g, 0.065, 0.05, 0.065, mats.goldTrim, px, rH + 0.05, pz);
      }
    };

    const hw = w * 0.48, hd = d * 0.48;
    if (sides.includes('front')) addRailEdge(-hw, hd, hw, hd);
    if (sides.includes('back')) addRailEdge(-hw, -hd, hw, -hd);
    if (sides.includes('left')) addRailEdge(-hw, -hd, -hw, hd);
    if (sides.includes('right')) addRailEdge(hw, -hd, hw, hd);

    parent.add(g);
    return g;
  }

  /**
   * 3. Complete Floating Shrine Complex (Itsukushima-style Haiden, Honden, Hirabutai, Kairo Corridors, & Soribashi Bridge)
   */
  function buildShrineComplex(THREE, mats, terrainHelper) {
    const complex = new THREE.Group();
    complex.name = 'FloatingShrineComplex';

    // Rotate the shrine complex slightly toward the front-left O-Torii approach (yaw = -0.32 rad)
    const shrineRoot = new THREE.Group();
    shrineRoot.position.set(-0.35, 0.0, -0.15);
    shrineRoot.rotation.y = -0.32;
    complex.add(shrineRoot);

    const deckY = 0.42;

    // A. Front Ritual Stage (Hirabutai 平舞台 & Takabutai 高舞台) jutting out toward the O-Torii
    buildStiltedDeck(THREE, shrineRoot, 0, deckY, 1.55, 3.45, 2.15, mats, {
      railingSides: ['front', 'left', 'right']
    });
    // Raised central ceremonial dance stage (Takabutai)
    addBox(THREE, shrineRoot, 1.38, 0.14, 1.28, mats.woodDark, 0, deckY + 0.08, 1.52);
    addBox(THREE, shrineRoot, 1.28, 0.04, 1.18, mats.vermilion, 0, deckY + 0.16, 1.52);
    // Low railing around Takabutai
    addBox(THREE, shrineRoot, 1.34, 0.10, 1.24, mats.vermilionDark, 0, deckY + 0.19, 1.52);
    addBox(THREE, shrineRoot, 1.20, 0.12, 1.10, mats.woodCypress, 0, deckY + 0.20, 1.52);

    // Extending front pier tongue (Hitasaki 火焼前) pointing toward the Grand Ryobu Torii
    buildStiltedDeck(THREE, shrineRoot, 0, deckY - 0.04, 2.95, 1.15, 0.95, mats, {
      railingSides: ['front', 'left', 'right']
    });

    // B. Main Worship Hall (Haiden 拝殿)
    buildStiltedDeck(THREE, shrineRoot, 0, deckY + 0.12, -0.05, 4.15, 2.10, mats, {
      railingSides: ['left', 'right']
    });

    const haidenH = 1.22;
    const haidenBaseY = deckY + 0.16;
    // White shikkui plaster core & dark lattice doors (Shitomido)
    addBox(THREE, shrineRoot, 3.45, haidenH, 1.48, mats.plasterWhite, 0, haidenBaseY + haidenH * 0.5, -0.05);
    addBox(THREE, shrineRoot, 2.25, haidenH * 0.82, 1.52, mats.woodDark, 0, haidenBaseY + haidenH * 0.45, -0.05);
    // Warm interior lantern glow visible through front sanctuary entrance
    addBox(THREE, shrineRoot, 0.95, haidenH * 0.72, 1.54, mats.lanternGlow, 0, haidenBaseY + haidenH * 0.42, -0.05, 0, 0, 0, false);

    // Vermilion structural columns around the Haiden perimeter
    for (let ix = -3; ix <= 3; ix++) {
      for (const iz of [-1, 1]) {
        addCyl(THREE, shrineRoot, 0.055, 0.062, haidenH + 0.05, 10, mats.vermilion, ix * 0.55, haidenBaseY + haidenH * 0.5, -0.05 + iz * 0.78);
      }
    }
    // Horizontal vermilion tie-beams (Nageshi)
    addBox(THREE, shrineRoot, 3.68, 0.09, 1.64, mats.vermilion, 0, haidenBaseY + haidenH - 0.06, -0.05);
    addBox(THREE, shrineRoot, 3.64, 0.07, 1.62, mats.vermilionDark, 0, haidenBaseY + haidenH * 0.65, -0.05);

    // Sacred Shimenawa rope + white zigzag Shide papers across the front entrance
    addCyl(THREE, shrineRoot, 0.035, 0.045, 1.45, 8, mats.woodCypress, 0, haidenBaseY + haidenH * 0.78, 0.82, 0, 0, Math.PI / 2);
    for (let s = -2; s <= 2; s++) {
      addBox(THREE, shrineRoot, 0.05, 0.16, 0.02, mats.plasterWhite, s * 0.26, haidenBaseY + haidenH * 0.68, 0.84, 0, 0, 0.12);
    }
    // Wooden Offering Box (Saisen-bako) + front steps
    addBox(THREE, shrineRoot, 0.52, 0.22, 0.32, mats.woodAged, 0, haidenBaseY + 0.11, 0.85);
    addBox(THREE, shrineRoot, 1.25, 0.14, 0.35, mats.woodAged, 0, deckY + 0.06, 0.92);

    // Sweeping Curved Irimoya Roof over the Haiden + Front Karahafu Entrance Portico
    const haidenRoof = buildCurvedRoof(THREE, 4.65, 1.08, 2.75, mats, {
      irimoya: true,
      useSlate: false,
      thickness: 0.13,
      curveLift: 0.26
    });
    haidenRoof.position.set(0, haidenBaseY + haidenH, -0.05);
    shrineRoot.add(haidenRoof);

    // Front Entrance Portico Roof (Kohaibuki)
    const porticoRoof = buildCurvedRoof(THREE, 1.75, 0.44, 1.15, mats, {
      irimoya: true,
      useSlate: false,
      thickness: 0.09,
      curveLift: 0.14
    });
    porticoRoof.position.set(0, haidenBaseY + haidenH - 0.12, 0.85);
    shrineRoot.add(porticoRoof);

    // C. Rear Main Sanctuary (Honden 本殿 — elevated at the foot of the mountain)
    const hondenY = deckY + 0.34;
    // Stone retaining terrace wall under Honden
    addBox(THREE, shrineRoot, 3.35, 0.75, 1.95, mats.stoneGranite, 0, hondenY - 0.38, -1.78);
    buildStiltedDeck(THREE, shrineRoot, 0, hondenY, -1.78, 3.25, 1.85, mats, {
      railingSides: ['left', 'right', 'back']
    });
    const hondenH = 1.32;
    addBox(THREE, shrineRoot, 2.65, hondenH, 1.32, mats.plasterWhite, 0, hondenY + hondenH * 0.5, -1.78);
    for (let ix = -2; ix <= 2; ix++) {
      for (const iz of [-1, 1]) {
        addCyl(THREE, shrineRoot, 0.058, 0.065, hondenH, 10, mats.vermilion, ix * 0.58, hondenY + hondenH * 0.5, -1.78 + iz * 0.68);
      }
    }
    addBox(THREE, shrineRoot, 2.78, 0.09, 1.44, mats.vermilion, 0, hondenY + hondenH - 0.05, -1.78);
    // Gold sanctuary doors
    addBox(THREE, shrineRoot, 0.78, hondenH * 0.75, 1.36, mats.goldTrim, 0, hondenY + hondenH * 0.42, -1.78);

    const hondenRoof = buildCurvedRoof(THREE, 3.85, 1.18, 2.45, mats, {
      irimoya: true,
      useSlate: false,
      thickness: 0.14,
      curveLift: 0.28,
      sacredFinials: true
    });
    hondenRoof.position.set(0, hondenY + hondenH, -1.78);
    shrineRoot.add(hondenRoof);

    // Covered connecting corridor (Heiden) between Haiden and Honden
    addBox(THREE, shrineRoot, 1.45, 0.95, 0.85, mats.vermilionDark, 0, deckY + 0.62, -0.95);
    const heidenRoof = buildCurvedRoof(THREE, 1.95, 0.48, 1.25, mats, { irimoya: false, useSlate: false, curveLift: 0.12 });
    heidenRoof.position.set(0, deckY + 1.12, -0.95);
    shrineRoot.add(heidenRoof);

    // D. Left & Right Covered Wing Corridors (Kairo 回廊) & Side Shrine Pavilions
    for (const side of [-1, 1]) {
      const corrX = side * 2.55;
      const corrZ = 0.25;
      buildStiltedDeck(THREE, shrineRoot, corrX, deckY, corrZ, 1.55, 0.95, mats, {
        railingSides: ['front', 'back']
      });
      // Corridor pillars & covered roof
      for (let ix = -1; ix <= 1; ix++) {
        for (const iz of [-1, 1]) {
          addCyl(THREE, shrineRoot, 0.042, 0.048, 0.88, 8, mats.vermilion, corrX + ix * 0.55, deckY + 0.44, corrZ + iz * 0.36);
        }
      }
      const corrRoof = buildCurvedRoof(THREE, 1.85, 0.38, 1.28, mats, {
        irimoya: true,
        useSlate: false,
        thickness: 0.08,
        curveLift: 0.12
      });
      corrRoof.position.set(corrX, deckY + 0.88, corrZ);
      shrineRoot.add(corrRoof);

      // Forward-turning wing pavilion (Maroudo / Tenjinsha Pavilion)
      const wingX = side * 3.15;
      const wingZ = 1.25;
      buildStiltedDeck(THREE, shrineRoot, wingX, deckY, wingZ, 1.15, 1.65, mats, {
        railingSides: ['front', side < 0 ? 'left' : 'right', side < 0 ? 'right' : 'left']
      });
      addBox(THREE, shrineRoot, 0.78, 0.82, 1.05, mats.shojiWindow, wingX, deckY + 0.42, wingZ - 0.12);
      for (const ix of [-1, 1]) {
        for (const iz of [-1, 0, 1]) {
          addCyl(THREE, shrineRoot, 0.044, 0.05, 0.88, 8, mats.vermilion, wingX + ix * 0.42, deckY + 0.44, wingZ + iz * 0.52);
        }
      }
      const wingRoof = buildCurvedRoof(THREE, 1.55, 0.52, 2.05, mats, {
        irimoya: true,
        useSlate: false,
        thickness: 0.09,
        curveLift: 0.15
      });
      wingRoof.position.set(wingX, deckY + 0.88, wingZ);
      shrineRoot.add(wingRoof);
    }

    // E. Iconic Arched Wooden Bridge (Soribashi 反橋) on the left coastal approach
    const bridgeGroup = new THREE.Group();
    bridgeGroup.position.set(-3.35, 0.18, 1.75);
    bridgeGroup.rotation.y = 0.55;
    const bridgeSegs = 12;
    const bLen = 1.85, bW = 0.72;
    for (let i = 0; i < bridgeSegs; i++) {
      const t = (i + 0.5) / bridgeSegs;
      const u = t * 2 - 1; // -1 .. 1
      const bz = u * (bLen * 0.5);
      const by = (1.0 - u * u) * 0.44;
      const slope = Math.atan(-2 * u * 0.44 / (bLen * 0.5));
      addBox(THREE, bridgeGroup, bW, 0.06, (bLen / bridgeSegs) * 1.12, mats.woodCypress, 0, by, bz, slope, 0, 0);
      for (const sx of [-1, 1]) {
        addBox(THREE, bridgeGroup, 0.05, 0.22, (bLen / bridgeSegs) * 1.12, mats.vermilion, sx * (bW * 0.46), by + 0.12, bz, slope, 0, 0);
        if (i % 3 === 0) {
          addBox(THREE, bridgeGroup, 0.06, 0.28, 0.06, mats.vermilionDark, sx * (bW * 0.46), by + 0.14, bz);
          addBox(THREE, bridgeGroup, 0.07, 0.04, 0.07, mats.goldTrim, sx * (bW * 0.46), by + 0.29, bz);
        }
      }
    }
    // Bridge support pilings
    for (const sz of [-0.55, 0, 0.55]) {
      for (const sx of [-0.28, 0.28]) {
        addCyl(THREE, bridgeGroup, 0.04, 0.045, 0.95, 8, mats.woodAged, sx, -0.15, sz);
      }

    complex.add(bridgeGroup);

    // F. Mountain Stone Stairway & Secondary Vermilion Torii Path (ascending right ridge & toward Pagoda)
    const stairPoints = [
      { x: 1.85, z: 0.55, ry: -0.25 },
      { x: 2.02, z: 0.18, ry: -0.20 },
      { x: 2.15, z: -0.18, ry: -0.15 },
      { x: 2.25, z: -0.55, ry: -0.10 },
      { x: 2.32, z: -0.92, ry: -0.05 },
      { x: 2.35, z: -1.28, ry: 0.05 },
      { x: 2.30, z: -1.65, ry: 0.15 },
      { x: 2.18, z: -2.02, ry: 0.25 },
      // Steps leading up to the 5-Story Pagoda terrace on the left
      { x: -1.85, z: -1.25, ry: 0.35 },
      { x: -2.02, z: -1.55, ry: 0.30 },

    for (const sp of stairPoints) {

    const smallToriiCoords = [
      { x: 1.98, z: 0.28, ry: -0.22, scale: 0.72 },
      { x: 2.28, z: -0.68, ry: -0.08, scale: 0.68 },
      { x: 2.26, z: -1.52, ry: 0.12, scale: 0.65 }
    ];
    for (const stc of smallToriiCoords) {
      const ty = terrainHelper.getTerrainHeight(stc.x, stc.z);
      const st = buildSmallTorii(THREE, mats, stc.scale);
      st.position.set(stc.x, ty - 0.04, stc.z);
      st.rotation.y = stc.ry;
      complex.add(st);
    }

    return complex;
  }

  /**
   * Builds all Architectural Elements: O-Torii, Floating Shrine Complex, 5-Story Pagoda,
   * and 10 Glowing Stone Lanterns with warm PointLights.
   */
  function buildAllArchitecture(THREE, terrainHelper) {
    const archGroup = new THREE.Group();
    archGroup.name = 'ShrineArchitectureGroup';
    const mats = createMaterials(THREE);

    // 1. Grand Ryobu O-Torii standing in the shallow tidal lagoon at (x = -1.65, z = 3.35)
    const toriiBedY = terrainHelper.getTerrainHeight(-1.65, 3.35);
    const grandTorii = buildRyobuTorii(THREE, mats);
    grandTorii.position.set(-1.65, toriiBedY - 0.05, 3.35);
    grandTorii.rotation.y = -0.32;
    archGroup.add(grandTorii);

    // 2. Floating Shrine Complex (Haiden, Honden, Hirabutai, Kairo, Soribashi)
    const shrineComplex = buildShrineComplex(THREE, mats, terrainHelper);
    archGroup.add(shrineComplex);

    // 3. Five-Story Pagoda (Goju-no-To) on the upper-left mountain terrace (-2.35, 2.08, -2.55)
    const pagoda = buildFiveStoryPagoda(THREE, mats);
    const pagY = terrainHelper.getTerrainHeight(-2.35, -2.55);
    pagoda.position.set(-2.35, pagY - 0.06, -2.55);
    pagoda.rotation.y = 0.22;
    archGroup.add(pagoda);

    // 4. Ten Traditional Stone Lanterns (Toro) + Warm PointLights
    const lanternSpecs = [
      // Two large Miyajima-style coastal stone lanterns flanking the approach
      { x: -2.85, z: 1.85, scale: 1.15, light: true },
      { x: 1.15, z: 2.55, scale: 1.15, light: true },
      // Two lanterns atop the Left & Right Sea-Stack Promontories
      { x: -3.95, z: 0.65, scale: 0.85, light: true },
      { x: 2.55, z: 1.85, scale: 0.85, light: true },
      // Two lanterns on the front corners of the Hirabutai stage
      { x: -1.25, z: 1.35, yOverride: 0.45, scale: 0.78, light: true },
      { x: 0.15, z: 1.82, yOverride: 0.45, scale: 0.78, light: true },
      // Lanterns along the mountain stairway & pagoda terrace
      { x: 1.65, z: 0.72, scale: 0.75, light: false },
      { x: 2.55, z: -0.35, scale: 0.72, light: false },
      { x: -1.55, z: -2.15, scale: 0.82, light: true },
      { x: -2.95, z: -2.05, scale: 0.82, light: false }
    ];

    const lanternLights = [];
    for (const ls of lanternSpecs) {
      const ly = ls.yOverride !== undefined ? ls.yOverride : terrainHelper.getTerrainHeight(ls.x, ls.z);
      const lantern = buildStoneLantern(THREE, mats, ls.scale);
      lantern.position.set(ls.x, ly - 0.02, ls.z);
      archGroup.add(lantern);

      if (ls.light) {
        const ptLight = new THREE.PointLight('#ffaa44', 0.65, 5.2);
        ptLight.position.set(ls.x, ly + 0.65 * ls.scale, ls.z);
        archGroup.add(ptLight);
        lanternLights.push(ptLight);
      }
    }

    // 5. Nocturnal Golden Fireflies / Spirit Motes (Hotaru 蛍) floating over lagoon & shrine at night
    const fireflyGroup = new THREE.Group();
    fireflyGroup.name = 'FireflyGroup';
    const fireflyMeshes = [];
    const fireflyGeom = new THREE.SphereGeometry(0.042, 6, 6);
    for (let i = 0; i < 36; i++) {
      const ang = i * 2.39996;
      const rad = 1.2 + (i / 36) * 5.8;
      const fx = -0.6 + Math.cos(ang) * rad;
      const fz = 0.8 + Math.sin(ang) * rad * 0.85;
      const fy = Math.max(0.25, terrainHelper.getTerrainHeight(fx, fz) + 0.45 + (i % 5) * 0.32);
      const fm = new THREE.Mesh(fireflyGeom, mats.fireflyGlow);
      fm.position.set(fx, fy, fz);
      fm.userData = { bx: fx, by: fy, bz: fz, phase: i * 1.37, speed: 0.8 + (i % 4) * 0.25 };
      fireflyGroup.add(fm);
      fireflyMeshes.push(fm);
    }
    archGroup.add(fireflyGroup);

    function updateNightEffects(elapsedTime, nightMix) {
      // Smoothly ramp shoji window & lantern emissive glow
      mats.shojiWindow.color.set('#f3eee4').lerp(new THREE.Color('#ffdfb0'), nightMix * 0.85);
      mats.shojiWindow.emissiveIntensity = 0.04 + nightMix * 1.45;
      mats.lanternGlow.emissiveIntensity = 1.25 + nightMix * 2.15;

      // Animate fireflies when nightMix > 0.02
      fireflyGroup.visible = nightMix > 0.02;
      mats.fireflyGlow.opacity = Math.min(0.95, nightMix * 1.15);
      if (fireflyGroup.visible) {
        for (let i = 0; i < fireflyMeshes.length; i++) {
          const fm = fireflyMeshes[i];
          const u = fm.userData;
          const t = elapsedTime * u.speed + u.phase;
          fm.position.set(
            u.bx + Math.sin(t * 1.3) * 0.28,
            u.by + Math.sin(t * 2.1) * 0.16,
            u.bz + Math.cos(t * 1.1) * 0.28
          );
          const pulse = (0.55 + 0.45 * Math.sin(t * 3.4)) * nightMix;
          fm.scale.set(pulse, pulse, pulse);
        }
      }
    }

    return {
      group: archGroup,
      grandTorii,
      shrineComplex,
      pagoda,
      lanternLights,
      materials: mats,
      updateNightEffects
    };
  }

  window.ShrineArchitecture = {
    buildRyobuTorii,
    buildFiveStoryPagoda,
    buildShrineComplex,
    buildStoneLantern,
    buildAllArchitecture
  };
})();


/**
 * pine-vegetation.js
 * Dense, Lush Japanese Pine & Cedar Forest Canopy (matching "Opus 5.5" in reference video),
 * Bonsai Sea-Stack Pines, and Mossy Cliff Cushions.
 */
(function () {
  function buildPineVegetationGroup(THREE, terrainHelper) {
    const group = new THREE.Group();
    group.name = 'PineVegetationGroup';

    const fbm2 = terrainHelper.fbm2;
    const noise2D = terrainHelper.noise2D;
    const getTerrainHeight = terrainHelper.getTerrainHeight;

    const trunkPos = [], trunkNorm = [], trunkCol = [], trunkIdx = [];
    let trunkVertOffset = 0;

    const foliagePos = [], foliageNorm = [], foliageCol = [], foliageIdx = [];
    let foliageVertOffset = 0;

    const cBarkDark = new THREE.Color('#3b281e');
    const cBarkRed = new THREE.Color('#5c3a28');

    // Rich botanical Japanese Pine & Cedar palette (matching the lush emerald/olive forest in frame_4s.png)
    const pinePalette = [
      new THREE.Color('#132915'), // Deep forest shadow
      new THREE.Color('#1b381d'), // Dark Kuro-matsu pine
      new THREE.Color('#244723'), // Rich mountain cedar
      new THREE.Color('#2f582b'), // Lush mid pine
      new THREE.Color('#3c6932'), // Sunlit pine needle pad
      new THREE.Color('#4c7b3b'), // Warm olive-cypress highlight
      new THREE.Color('#5f8e46'), // Bright sunlit canopy tip
      new THREE.Color('#709e52')  // Golden-green spring shoot
    ];

    function addBranchSegment(x1, y1, z1, x2, y2, z2, rBot, rTop, segs = 6) {
      const dx = x2 - x1, dy = y2 - y1, dz = z2 - z1;
      const len = Math.hypot(dx, dy, dz) || 0.001;
      const ux = dx / len, uy = dy / len, uz = dz / len;
      let ax = 0, ay = 1, az = 0;
      if (Math.abs(uy) > 0.9) { ax = 1; ay = 0; }
      let bx = uy * az - uz * ay, by = uz * ax - ux * az, bz = ux * ay - uy * ax;
      const bLen = Math.hypot(bx, by, bz) || 1;
      bx /= bLen; by /= bLen; bz /= bLen;
      const cx = uy * bz - uz * by, cy = uz * bx - ux * bz, cz = ux * by - uy * bx;

      const rings = 2;
      for (let iy = 0; iy <= rings; iy++) {
        const v = iy / rings;
        const r = rBot + (rTop - rBot) * v;
        const px0 = x1 + dx * v;
        const py0 = y1 + dy * v;
        const pz0 = z1 + dz * v;
        const col = cBarkDark.clone().lerp(cBarkRed, v * 0.7);

        for (let ix = 0; ix <= segs; ix++) {
          const theta = (ix / segs) * Math.PI * 2;
          const cosT = Math.cos(theta), sinT = Math.sin(theta);
          const nx = bx * cosT + cx * sinT;
          const ny = by * cosT + cy * sinT;
          const nz = bz * cosT + cz * sinT;
          trunkPos.push(px0 + nx * r, py0 + ny * r, pz0 + nz * r);
          trunkNorm.push(nx, ny, nz);
          trunkCol.push(col.r, col.g, col.b);
        }
      }

      for (let iy = 0; iy < rings; iy++) {
        for (let ix = 0; ix < segs; ix++) {
          const row1 = trunkVertOffset + iy * (segs + 1);
          const row2 = trunkVertOffset + (iy + 1) * (segs + 1);
          const a = row1 + ix, b = row2 + ix, c = row2 + ix + 1, d = row1 + ix + 1;
          trunkIdx.push(a, b, d, b, c, d);
        }
      }
      trunkVertOffset += (rings + 1) * (segs + 1);
    }

    const baseSphere = new THREE.IcosahedronGeometry(1.0, 2);
    const bsPos = baseSphere.attributes.position;
    const bsIdx = baseSphere.index.array;

    function addFoliageCluster(cx, cy, cz, rx, ry, rz, baseColor, topColor, treeBaseY) {
      const localPos = [];
      for (let i = 0; i < bsPos.count; i++) {
        let vx = bsPos.getX(i);
        let vy = bsPos.getY(i);
        let vz = bsPos.getZ(i);

        if (vy < 0) vy *= 0.52;

        const n1 = fbm2((vx + cx) * 2.8, (vz + cz) * 2.8 + vy * 2.2, 3);
        const n2 = noise2D((vx * 6.2 + cz * 1.7), (vz * 6.2 - cx * 1.7));
        const tuft = Math.sin(vx * 8.5 + cx * 3.0) * Math.cos(vz * 8.5 + cz * 3.0) * 0.11;
        const displace = 0.78 + 0.42 * n1 + 0.22 * n2 + tuft;

        const wx = cx + vx * rx * displace;
        const wy = cy + vy * ry * displace;
        const wz = cz + vz * rz * displace;
        localPos.push(wx, wy, wz);
      }

      const tmpG = new THREE.BufferGeometry();
      tmpG.setAttribute('position', new THREE.Float32BufferAttribute(localPos, 3));
      tmpG.setIndex(Array.from(bsIdx));
      tmpG.computeVertexNormals();
      const nAttr = tmpG.attributes.normal;

      for (let i = 0; i < bsPos.count; i++) {
        const wx = localPos[i * 3], wy = localPos[i * 3 + 1], wz = localPos[i * 3 + 2];
        let nx = nAttr.getX(i) + (noise2D(wx * 9.5, wz * 9.5) - 0.5) * 0.38;
        let ny = nAttr.getY(i) + (noise2D(wy * 9.5, wx * 9.5) - 0.5) * 0.25;
        let nz = nAttr.getZ(i) + (noise2D(wz * 9.5, wy * 9.5) - 0.5) * 0.38;
        const nLen = Math.hypot(nx, ny, nz) || 1;
        nx /= nLen; ny /= nLen; nz /= nLen;
        foliagePos.push(wx, wy, wz);
        foliageNorm.push(nx, ny, nz);

        const localTopT = Math.max(0, Math.min(1, (ny + 0.55) / 1.45));
        const canopyHeightT = Math.max(0, Math.min(1, (wy - treeBaseY) / 1.65));
        const ao = (0.56 + 0.44 * localTopT) * (0.76 + 0.24 * canopyHeightT);
        const microVar = 0.92 + 0.16 * noise2D(wx * 4.0, wz * 4.0);

        const c = baseColor.clone().lerp(topColor, localTopT * 0.82);
        foliageCol.push(
          Math.min(1, c.r * ao * microVar),
          Math.min(1, c.g * ao * microVar),
          Math.min(1, c.b * ao * microVar)
        );
      }

      for (let i = 0; i < bsIdx.length; i++) {
        foliageIdx.push(foliageVertOffset + bsIdx[i]);
      }
      foliageVertOffset += bsPos.count;
    }

    function addPineTree(x, z, scale = 1.0, leanX = 0.0, leanZ = 0.0, paletteIdx = 2) {
      const baseY = getTerrainHeight(x, z) - 0.05;
      const trunkH = (0.95 + 0.28 * Math.abs(noise2D(x * 1.3, z * 1.3))) * scale;
      const topX = x + leanX * scale;
      const topY = baseY + trunkH;
      const topZ = z + leanZ * scale;

      addBranchSegment(x, baseY, z, topX, topY, topZ, 0.075 * scale, 0.032 * scale, 6);

      const cDark = pinePalette[Math.max(0, paletteIdx - 1)];
      const cBright = pinePalette[Math.min(pinePalette.length - 1, paletteIdx + 2)];

      addFoliageCluster(
        topX, topY + 0.08 * scale, topZ,
        0.54 * scale, 0.36 * scale, 0.52 * scale,
        cDark, cBright, baseY
      );

      const branchCount = 5;
      for (let b = 0; b < branchCount; b++) {
        const t = 0.38 + (b / branchCount) * 0.54;
        const ang = b * 2.39996 + x * 1.7 + z * 2.3;
        const bLen = (0.44 + (1.0 - t) * 0.42) * scale;
        const bx1 = x + (topX - x) * t;
        const by1 = baseY + trunkH * t;
        const bz1 = z + (topZ - z) * t;
        const bx2 = bx1 + Math.cos(ang) * bLen;
        const by2 = by1 + 0.06 * scale;
        const bz2 = bz1 + Math.sin(ang) * bLen;

        addBranchSegment(bx1, by1, bz1, bx2, by2, bz2, 0.035 * scale, 0.016 * scale, 5);

        const padR = (0.44 + (1.0 - t) * 0.26) * scale;
        const padH = padR * 0.65;
        addFoliageCluster(bx2, by2 + 0.04 * scale, bz2, padR, padH, padR * 0.94, cDark, cBright, baseY);
      }
    }

    // Helper: Check if (x, z) is inside an architectural exclusion zone (Shrine complex or Pagoda core)
    function isExcludedZone(x, z) {
      // Five-Story Pagoda footprint (-2.35, -2.55)
      if (Math.hypot(x + 2.35, z + 2.55) < 0.98) return true;
      // Main Honden footprint
      if (x > -1.75 && x < 1.15 && z > -1.95 && z < -0.65) return true;
      // Front Haiden, Hirabutai & Kairo footprint
      if (x > -3.25 && x < 2.15 && z >= -0.65 && z < 2.45) return true;
      return false;
    }

    // 1. Hero Coastal Bonsai Pines (Iso-matsu) on the Left & Right Sea-Stack Promontories!
    addPineTree(-4.28, 0.42, 0.96, 0.35, 0.24, 3);
    addPineTree(-4.65, 0.85, 0.68, -0.22, 0.28, 2);
    addPineTree(2.82, 1.88, 1.02, -0.32, 0.25, 3);
    addPineTree(3.25, 2.20, 0.72, 0.22, 0.18, 4);

    // 2. Dense Mountain Pine Trees across the Mount Misen Massif (55 hero trees)
    for (let i = 0; i < 58; i++) {
      const ang = i * 2.3999632; // Golden angle spiral
      const rNorm = Math.sqrt((i + 0.5) / 58);
      const sx = 0.85 + Math.cos(ang) * rNorm * 5.25;
      const sz = -2.85 + Math.sin(ang) * rNorm * 3.85;

      if (isExcludedZone(sx, sz)) continue;
      const sy = getTerrainHeight(sx, sz);
      if (sy < 0.35) continue;

      const scale = 0.82 + 0.42 * (1.0 - rNorm * 0.55) + 0.15 * Math.abs(noise2D(sx, sz));
      const pIdx = 1 + ((i * 3) % 5);
      const lx = (noise2D(sx * 2.1, sz * 2.1) - 0.5) * 0.22;
      const lz = (noise2D(sz * 2.1, sx * 2.1) - 0.5) * 0.22;
      addPineTree(sx, sz, scale, lx, lz, pIdx);
    }

    // 3. Dense Multi-Scale Canopy & Hillside Foliage Blanket (260+ overlapping botanical clusters!)
    // Blankets the mountain slopes just like the lush green hillside in "Opus 5.5" (frame_4s.png)
    for (let i = 0; i < 270; i++) {
      const ang = i * 2.3999632 + 0.5;
      const rNorm = Math.pow((i + 0.5) / 270, 0.58);
      const sx = 0.75 + Math.cos(ang) * rNorm * 5.85;
      const sz = -2.65 + Math.sin(ang) * rNorm * 4.35;

      if (isExcludedZone(sx, sz)) continue;
      const sy = getTerrainHeight(sx, sz);
      if (sy < 0.25) continue;

      const pIdx = 1 + ((i * 5) % (pinePalette.length - 2));
      const cDark = pinePalette[Math.max(0, pIdx - 1)];
      const cBright = pinePalette[Math.min(pinePalette.length - 1, pIdx + 2)];

      const baseR = 0.34 + (i % 6) * 0.075 * (1.0 - rNorm * 0.28);
      const liftY = 0.18 + (i % 4) * 0.12;
      addFoliageCluster(
        sx, sy + liftY, sz,
        baseR * 1.24, baseR * 0.58, baseR * 1.20,
        cDark, cBright, sy - 0.15
      );
    }

    // 4. Framing Foliage Clusters around the 5-Story Pagoda Base & Shrine Flanks
    const framingClusters = [
      { x: -1.05, z: -2.25, r: 0.56, p: 3 },
      { x: -0.45, z: -2.35, r: 0.62, p: 4 },
      { x: 0.25, z: -2.30, r: 0.58, p: 3 },
      { x: 0.95, z: -2.15, r: 0.55, p: 4 },
      { x: -0.75, z: -2.75, r: 0.64, p: 2 },
      { x: 0.15, z: -2.85, r: 0.65, p: 3 },
      { x: 0.85, z: -2.65, r: 0.60, p: 4 },
      { x: -1.45, z: -2.25, r: 0.48, p: 4 },
      { x: -1.65, z: -1.75, r: 0.42, p: 5 },
      { x: -3.15, z: -2.15, r: 0.52, p: 3 },
      { x: -2.95, z: -1.55, r: 0.45, p: 4 },
      { x: -3.35, z: -0.95, r: 0.40, p: 3 },
      { x: 1.65, z: -1.55, r: 0.52, p: 4 },
      { x: 2.05, z: -1.15, r: 0.46, p: 5 },
      { x: 2.65, z: -0.45, r: 0.44, p: 3 },
      { x: 3.15, z: 0.35, r: 0.46, p: 4 },
      { x: 2.85, z: 0.85, r: 0.45, p: 3 },
      { x: 3.45, z: -0.15, r: 0.48, p: 4 },
      { x: 2.35, z: 1.05, r: 0.42, p: 5 },
      { x: -0.15, z: -1.95, r: 0.54, p: 3 },
      { x: -0.85, z: -1.95, r: 0.52, p: 4 },
      { x: 0.55, z: -1.95, r: 0.52, p: 3 },
      { x: -3.85, z: 0.25, r: 0.36, p: 4 },
      { x: 2.35, z: 1.65, r: 0.38, p: 5 }
    ];
    for (const fc of framingClusters) {
      const sy = getTerrainHeight(fc.x, fc.z);
      addFoliageCluster(
        fc.x, sy + fc.r * 0.45, fc.z,
        fc.r * 1.15, fc.r * 0.82, fc.r * 1.12,
        pinePalette[fc.p - 1], pinePalette[fc.p + 2], sy
      );
    }

    const trunkGeom = new THREE.BufferGeometry();
    trunkGeom.setAttribute('position', new THREE.Float32BufferAttribute(trunkPos, 3));
    trunkGeom.setAttribute('normal', new THREE.Float32BufferAttribute(trunkNorm, 3));
    trunkGeom.setAttribute('color', new THREE.Float32BufferAttribute(trunkCol, 3));
    trunkGeom.setIndex(trunkIdx);
    const trunkMesh = new THREE.Mesh(trunkGeom, new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.85,
      metalness: 0.02
    }));
    trunkMesh.castShadow = true;
    trunkMesh.receiveShadow = true;
    group.add(trunkMesh);

    const foliageGeom = new THREE.BufferGeometry();
    foliageGeom.setAttribute('position', new THREE.Float32BufferAttribute(foliagePos, 3));
    foliageGeom.setAttribute('normal', new THREE.Float32BufferAttribute(foliageNorm, 3));
    foliageGeom.setAttribute('color', new THREE.Float32BufferAttribute(foliageCol, 3));
    foliageGeom.setIndex(foliageIdx);
    const foliageMesh = new THREE.Mesh(foliageGeom, new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.78,
      metalness: 0.02
    }));
    foliageMesh.castShadow = true;
    foliageMesh.receiveShadow = true;
    group.add(foliageMesh);

    return {
      group,
      trunkMesh,
      foliageMesh
    };

    buildPineVegetationGroup

  // Helper: 3-stop smooth color interpolation (Day -> Golden Twilight -> Starry Night)
  function lerpColor3(THREE, hexDay, hexDusk, hexNight, mix) {
    const cDay = new THREE.Color(hexDay);
    const cDusk = new THREE.Color(hexDusk);
    const cNight = new THREE.Color(hexNight);
    if (mix < 0.45) {
      return cDay.lerp(cDusk, mix / 0.45);
    }
    return cDusk.lerp(cNight, (mix - 0.45) / 0.55);
  }

    let prevPointer = { x: 0, y: 0 };
    let pinchStartDist = 0;

    domElem.addEventListener('contextmenu', (e) => e.preventDefault());

      if (!isDragging) return;
      const dx = e.clientX - prevPointer.x;
      const dy = e.clientY - prevPointer.y;
      prevPointer.x = e.clientX;
      prevPointer.y = e.clientY;

      if (dragMode === 'rotate') {
        camSpherical.targetTheta -= dx * 0.0065;
        camSpherical.targetPhi = THREE.MathUtils.clamp(
          camSpherical.targetPhi - dy * 0.0055,
          0.14,
          Math.PI * 0.465
        );
      } else {
        const panScale = camSpherical.radius * 0.0012;
        const rightX = Math.cos(camSpherical.theta);
        const rightZ = -Math.sin(camSpherical.theta);
        const fwdX = Math.sin(camSpherical.theta);
        const fwdZ = Math.cos(camSpherical.theta);
        camTargetGoal.x = THREE.MathUtils.clamp(camTargetGoal.x - (dx * rightX - dy * fwdX) * panScale, -7.5, 7.5);
        camTargetGoal.z = THREE.MathUtils.clamp(camTargetGoal.z - (dx * rightZ - dy * fwdZ) * panScale, -7.5, 7.5);
      }
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    domElem.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = 1.0 + Math.sign(e.deltaY) * 0.085;
      camSpherical.targetRadius = THREE.MathUtils.clamp(
        camSpherical.targetRadius * zoomFactor,
        7.2,
        46.0
      );
    }, { passive: false });

      closeAllCustomDropdowns();
      if (e.touches.length === 1) {
        isDragging = true;
        dragMode = 'rotate';
        prevPointer.x = e.touches[0].clientX;
        prevPointer.y = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        isDragging = true;
        dragMode = 'pinch';
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        pinchStartDist = Math.hypot(dx, dy) || 1;
        pinchStartRadius = camSpherical.targetRadius;
        prevPointer.x = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
        prevPointer.y = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;

      if (!isDragging) return;

        const dy = e.touches[0].clientY - prevPointer.y;
        prevPointer.x = e.touches[0].clientX;
        prevPointer.y = e.touches[0].clientY;

          camSpherical.targetPhi - dy * 0.006,
          0.14,
          Math.PI * 0.465
        );
      } else if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy) || 1;
        camSpherical.targetRadius = THREE.MathUtils.clamp(
          pinchStartRadius * (pinchStartDist / dist),
          7.2,
          46.0
        );
        const mx = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
        const my = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
        const pdx = mx - prevPointer.x;
        const pdy = my - prevPointer.y;
        prevPointer.x = mx;
        prevPointer.y = my;
        const panScale = camSpherical.radius * 0.0012;
        const rightX = Math.cos(camSpherical.theta);
        const rightZ = -Math.sin(camSpherical.theta);
        camTargetGoal.x = THREE.MathUtils.clamp(camTargetGoal.x - pdx * rightX * panScale, -7.5, 7.5);
        camTargetGoal.z = THREE.MathUtils.clamp(camTargetGoal.z - pdx * rightZ * panScale, -7.5, 7.5);
        camTargetGoal.y = THREE.MathUtils.clamp(camTargetGoal.y + pdy * panScale * 0.6, -2.0, 4.0);
      }

      isDragging = false;
    });

    /**
     * Smoothly evaluates and applies all Day <-> Twilight <-> Night lighting, sky, water,
     * shadow-plane, and lantern parameters for the current `state.dayNightMix` ∈ [0, 1].
     */
    function applyAtmosphereAndDayNight(elapsedTime = 0) {
      const p = PRESETS[state.preset] || PRESETS.summer;
      const mix = THREE.MathUtils.clamp(state.dayNightMix, 0.0, 1.0);

      // 1. Background, Studio Contact Shadow Plane, & Fog
      const bgCol = lerpColor3(THREE, p.bg, p.duskBg, p.nightBg, mix);
      scene.background.copy(bgCol);
      if (scene.fog) scene.fog.color.copy(bgCol);
      if (terrainData.shadowPlaneMat) {
        terrainData.shadowPlaneMat.color.copy(bgCol);
      }
      document.body.style.backgroundColor = '#' + bgCol.getHexString();
      document.body.classList.toggle('night-ui', mix > 0.52);

      // 2. Celestial Arc (Sun -> Sunset Horizon -> Moon)
      // During dusk (mix ~ 0.45), dip elevation slightly toward the horizon for dramatic golden-hour shadows!
      const duskDip = Math.sin(mix * Math.PI) * 18.0;
      const effectiveEl = Math.max(14, state.sunElevation - duskDip);
      const effectiveAz = state.sunAzimuth + mix * 28.0;
      const elRad = THREE.MathUtils.degToRad(effectiveEl);
      const azRad = THREE.MathUtils.degToRad(effectiveAz);
      const r = 28.0;
      const sx = r * Math.cos(elRad) * Math.sin(azRad);
      const sy = r * Math.sin(elRad);
      const sz = r * Math.cos(elRad) * Math.cos(azRad);
      sunLight.position.set(sx, sy, sz);
      waterData.uniforms.uSunDir.value.set(sx, sy, sz).normalize();

      const keyCol = lerpColor3(THREE, p.sunColor, p.duskSunColor, p.nightMoonColor, mix);
      sunLight.color.copy(keyCol);
      sunLight.intensity = THREE.MathUtils.lerp(p.sunIntensity, 0.54, mix);

      // Ambient & Hemisphere lights transition from warm studio daylight to deep moonlit indigo
      ambientLight.color.set('#fffaf2').lerp(new THREE.Color('#344d78'), mix);
      ambientLight.intensity = THREE.MathUtils.lerp(p.ambientIntensity, 0.34, mix);

      hemiLight.color.set('#fffdf8').lerp(new THREE.Color('#2c4470'), mix);
      hemiLight.groundColor.set('#688273').lerp(new THREE.Color('#121c2d'), mix);
      hemiLight.intensity = THREE.MathUtils.lerp(p.hemiIntensity, 0.38, mix);

      fillLight.color.set('#bfe6eb').lerp(new THREE.Color('#284678'), mix);
      fillLight.intensity = THREE.MathUtils.lerp(0.36, 0.22, mix);

      // 3. Water Uniforms (Shallow, Deep, Sky Reflection, Specular, & Nocturnal Lantern Shimmer)
      const dayShallow = state.customShallowColor || p.shallow;
      const dayDeep = state.customDeepColor || p.deep;
      waterData.uniforms.uShallowColor.value.set(dayShallow).lerp(new THREE.Color(p.nightShallow), mix);
      waterData.uniforms.uDeepColor.value.set(dayDeep).lerp(new THREE.Color(p.nightDeep), mix);
      waterData.uniforms.uSkyColor.value.set(p.skyRefl).lerp(new THREE.Color(p.nightSkyRefl), mix);
      waterData.uniforms.uSunColor.value.copy(keyCol);
      waterData.uniforms.uNightMix.value = mix;

      // 4. Shrine Lanterns, Shoji Windows, & Fireflies
      const targetLanternInt = THREE.MathUtils.lerp(p.lanternIntensity, 2.35, mix);
      const targetLanternDist = THREE.MathUtils.lerp(5.2, 8.2, mix);
      for (const pt of archData.lanternLights) {
        pt.intensity = targetLanternInt;
        pt.distance = targetLanternDist;
      }
      if (archData.updateNightEffects) {
        archData.updateNightEffects(elapsedTime, mix);
      }
    }

    function applyPreset(presetKey) {
      const p = PRESETS[presetKey] || PRESETS.summer;
      state.preset = presetKey;
      state.sunElevation = p.sunElevation;
      state.sunAzimuth = p.sunAzimuth;
      state.clarity = p.clarity;
      state.foam = p.foam;
      state.customShallowColor = null;
      state.customDeepColor = null;

      waterData.uniforms.uClarity.value = p.clarity;
      waterData.uniforms.uFoamIntensity.value = p.foam;

      applyAtmosphereAndDayNight(0);
      syncTuneInputs();
      updateAllLocalizedText();
      highlightActiveDropdownItems();
    }

    function setDayNightMode(nightBool) {
      state.isNight = Boolean(nightBool);
      state.dayNightTarget = state.isNight ? 1.0 : 0.0;
      const btnDN = document.getElementById('btn-daynight');
      const iconSun = document.getElementById('icon-sun');
      const iconMoon = document.getElementById('icon-moon');
      if (btnDN) btnDN.classList.toggle('active-pill', state.isNight);
      if (iconSun) iconSun.classList.toggle('hidden', state.isNight);
      if (iconMoon) iconMoon.classList.toggle('hidden', !state.isNight);
      updateAllLocalizedText();
    }

    function setCameraView(viewKey) {
      const v = CAMERA_VIEWS[viewKey] || CAMERA_VIEWS.overview;
      state.cameraView = viewKey;
      camSpherical.targetTheta = v.theta;
      camSpherical.targetPhi = v.phi;
      camSpherical.targetRadius = v.radius;
      camTargetGoal.set(v.target[0], v.target[1], v.target[2]);

      document.querySelectorAll('[data-cam-view]').forEach((btn) => {
        btn.classList.toggle('active-pill', btn.getAttribute('data-cam-view') === viewKey);
      });
    }

    function setQuality(qKey) {
      state.quality = qKey;
      const dpr = window.devicePixelRatio || 1;
      if (qKey === 'low') {
        renderer.setPixelRatio(Math.min(dpr, 1.0));
        renderer.shadowMap.enabled = false;
      } else if (qKey === 'medium') {
        renderer.setPixelRatio(Math.min(dpr, 1.25));
        renderer.shadowMap.enabled = true;
      } else if (qKey === 'high') {
        renderer.setPixelRatio(Math.min(dpr, 1.75));
        renderer.shadowMap.enabled = true;
      } else {
        renderer.setPixelRatio(Math.min(dpr, 2.0));
        renderer.shadowMap.enabled = true;
      }
      const hiddenSelect = document.getElementById('select-quality');
      if (hiddenSelect) hiddenSelect.value = qKey;
      updateAllLocalizedText();
      highlightActiveDropdownItems();
    }

    function setLanguage(langKey) {
      if (!I18N[langKey]) return;
      state.lang = langKey;
      document.documentElement.lang = langKey === 'zh' ? 'zh-Hant' : langKey;
      updateAllLocalizedText();
      highlightActiveDropdownItems();
    }

    function updateAllLocalizedText() {
      const dict = I18N[state.lang] || I18N.en;

      // Update elements with data-i18n
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const key = el.getAttribute('data-i18n');
        if (key && dict[key]) {
          el.textContent = dict[key];
        }
      });

      // Dynamic state labels
      const labelPreset = document.getElementById('label-preset');
      if (labelPreset) labelPreset.textContent = dict['preset_' + state.preset] || PRESETS[state.preset].name;

      const labelDayNight = document.getElementById('label-daynight');
      if (labelDayNight) labelDayNight.textContent = state.isNight ? dict.night : dict.day;

      const labelTide = document.getElementById('label-tide');
      if (labelTide) labelTide.textContent = state.tide === 'low' ? dict.lowTide : dict.highTide;

      const labelQuality = document.getElementById('label-quality-val');
      if (labelQuality) labelQuality.textContent = dict['q_' + state.quality] || state.quality;

      const labelLang = document.getElementById('label-lang');
      if (labelLang) labelLang.textContent = dict.langName;
    }

    // Custom Dropdown Menu Controller
    function closeAllCustomDropdowns(exceptId = null) {
      document.querySelectorAll('.custom-dropdown-menu').forEach((menu) => {
        if (menu.id !== exceptId) {
          menu.classList.add('hidden');
        }
      });
      document.querySelectorAll('.dropdown-chevron').forEach((chev) => {
        const parentMenuId = chev.getAttribute('data-chevron-for');
        if (parentMenuId !== exceptId) {
          chev.style.transform = 'rotate(0deg)';
        }
      });
    }

    function toggleCustomDropdown(menuId) {
      const menu = document.getElementById(menuId);
      if (!menu) return;
      const willOpen = menu.classList.contains('hidden');
      closeAllCustomDropdowns(willOpen ? menuId : null);
      menu.classList.toggle('hidden', !willOpen);
      const chev = document.querySelector(`[data-chevron-for="${menuId}"]`);
      if (chev) {
        chev.style.transform = willOpen ? 'rotate(180deg)' : 'rotate(0deg)';
      }
    }

    function highlightActiveDropdownItems() {
      document.querySelectorAll('[data-preset-chip]').forEach((el) => {
        el.classList.toggle('active-chip', el.getAttribute('data-preset-chip') === state.preset);
      });
      document.querySelectorAll('[data-preset-option]').forEach((el) => {
        const active = el.getAttribute('data-preset-option') === state.preset;
        el.classList.toggle('active-dropdown-item', active);
      });
      document.querySelectorAll('[data-quality-option]').forEach((el) => {
        const active = el.getAttribute('data-quality-option') === state.quality;
        el.classList.toggle('active-dropdown-item', active);
      });
      document.querySelectorAll('[data-lang-option]').forEach((el) => {
        const active = el.getAttribute('data-lang-option') === state.lang;
        el.classList.toggle('active-dropdown-item', active);
      });
    }

    // 4. Bind UI Controls
    const btnAutoRotate = document.getElementById('btn-autorotate');
    const btnResetCam = document.getElementById('btn-reset-cam');
    const btnDayNight = document.getElementById('btn-daynight');
    const btnPreset = document.getElementById('btn-preset');
    const btnTide = document.getElementById('btn-tide');
    const btnQualityTrigger = document.getElementById('btn-quality-trigger');
    const selectQuality = document.getElementById('select-quality');
    const btnLangTrigger = document.getElementById('btn-lang-trigger');
    const btnTune = document.getElementById('btn-tune');
    const panelTune = document.getElementById('panel-tune');
    const btnCloseTune = document.getElementById('btn-close-tune');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    if (btnAutoRotate) {
      btnAutoRotate.addEventListener('click', () => {
        state.autoRotate = !state.autoRotate;
        btnAutoRotate.classList.toggle('active-pill', state.autoRotate);
        btnAutoRotate.setAttribute('aria-pressed', String(state.autoRotate));
      });
    }

    if (btnResetCam) {
      btnResetCam.addEventListener('click', () => {
        setCameraView('overview');
      });
    }

    if (btnDayNight) {
      btnDayNight.addEventListener('click', () => {
        setDayNightMode(!state.isNight);
      });
    }

    if (btnPreset) {
      btnPreset.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCustomDropdown('menu-preset');
      });
    }

    if (btnQualityTrigger) {
      btnQualityTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCustomDropdown('menu-quality');
      });
    }

    if (btnLangTrigger) {
      btnLangTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCustomDropdown('menu-lang');
      });
    }

    document.querySelectorAll('[data-preset-option]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const k = el.getAttribute('data-preset-option');
        if (k && PRESETS[k]) applyPreset(k);
        closeAllCustomDropdowns();
      });
    });

    document.querySelectorAll('[data-preset-chip]').forEach((el) => {
      el.addEventListener('click', () => {
        const k = el.getAttribute('data-preset-chip');
        if (k && PRESETS[k]) applyPreset(k);
      });
    });

    document.querySelectorAll('[data-quality-option]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const q = el.getAttribute('data-quality-option');
        if (q) setQuality(q);
        closeAllCustomDropdowns();
      });
    });

    document.querySelectorAll('[data-lang-option]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const l = el.getAttribute('data-lang-option');
        if (l) setLanguage(l);
        closeAllCustomDropdowns();
      });
    });

    window.addEventListener('click', () => {
      closeAllCustomDropdowns();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAllCustomDropdowns();
    });

    document.querySelectorAll('[data-cam-view]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const vKey = btn.getAttribute('data-cam-view');
        if (vKey) setCameraView(vKey);
      });
    });

    if (btnTide) {
      btnTide.addEventListener('click', () => {
        if (state.tide === 'high') {
          state.tide = 'low';
          state.targetWaterLevel = -0.34;
          btnTide.classList.add('active-pill');
        } else {
          state.tide = 'high';
          state.targetWaterLevel = 0.0;
          btnTide.classList.remove('active-pill');
        }
        updateAllLocalizedText();
        const slWater = document.getElementById('slider-water-level');
        const valWater = document.getElementById('val-water-level');
        if (slWater) slWater.value = String(state.targetWaterLevel);
        if (valWater) valWater.textContent = state.targetWaterLevel.toFixed(2) + 'm';
      });
    }

    if (selectQuality) {
      selectQuality.addEventListener('change', (e) => {
        setQuality(e.target.value);
      });
    }

    if (btnTune && panelTune) {
      btnTune.addEventListener('click', () => {
        const isHidden = panelTune.classList.toggle('hidden');
        btnTune.classList.toggle('active-pill', !isHidden);
      });
    }
    if (btnCloseTune && panelTune && btnTune) {
      btnCloseTune.addEventListener('click', () => {
        panelTune.classList.add('hidden');
        btnTune.classList.remove('active-pill');
      });
    }

    if (btnFullscreen) {
      btnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });
    }

    // Bind Live Tune Sliders & Color Pickers
    function bindSlider(id, valId, fmt, onChange) {
      const el = document.getElementById(id);
      const vEl = document.getElementById(valId);
      if (!el) return;
      el.addEventListener('input', () => {
        const num = parseFloat(el.value);
        if (vEl) vEl.textContent = fmt(num);
        onChange(num);
      });
    }

    bindSlider('slider-day-night', 'val-day-night', (v) => Math.round(v * 100) + '%', (v) => {
      state.dayNightTarget = v;
      state.dayNightMix = v;
      state.isNight = v > 0.5;
      const btnDN = document.getElementById('btn-daynight');
      const iconSun = document.getElementById('icon-sun');
      const iconMoon = document.getElementById('icon-moon');
      if (btnDN) btnDN.classList.toggle('active-pill', state.isNight);
      if (iconSun) iconSun.classList.toggle('hidden', state.isNight);
      if (iconMoon) iconMoon.classList.toggle('hidden', !state.isNight);
      updateAllLocalizedText();
      applyAtmosphereAndDayNight(0);
    });

    bindSlider('slider-water-level', 'val-water-level', (v) => v.toFixed(2) + 'm', (v) => {
      state.targetWaterLevel = v;
      state.tide = v < -0.22 ? 'low' : 'high';
      updateAllLocalizedText();
    });

    bindSlider('slider-wave-height', 'val-wave-height', (v) => v.toFixed(3), (v) => {
      state.waveHeight = v;
      waterData.uniforms.uWaveHeight.value = v;
    });

    bindSlider('slider-clarity', 'val-clarity', (v) => v.toFixed(2), (v) => {
      state.clarity = v;
      waterData.uniforms.uClarity.value = v;
    });

    bindSlider('slider-foam', 'val-foam', (v) => Math.round(v * 100) + '%', (v) => {
      state.foam = v;
      waterData.uniforms.uFoamIntensity.value = v;
    });

    bindSlider('slider-sun-el', 'val-sun-el', (v) => Math.round(v) + '°', (v) => {
      state.sunElevation = v;
      applyAtmosphereAndDayNight(0);
    });

    bindSlider('slider-sun-az', 'val-sun-az', (v) => Math.round(v) + '°', (v) => {
      state.sunAzimuth = v;
      applyAtmosphereAndDayNight(0);
    });

    bindSlider('slider-foliage', 'val-foliage', (v) => Math.round(v * 100) + '%', (v) => {
      state.foliageScale = v;
      vegData.foliageMesh.scale.set(1, v, 1);
    });

    bindSlider('slider-fov', 'val-fov', (v) => Math.round(v) + '°', (v) => {
      state.fov = v;
      camera.fov = v;
      camera.updateProjectionMatrix();
    });

    const colorShallow = document.getElementById('color-shallow');
    if (colorShallow) {
      colorShallow.addEventListener('input', () => {
        state.customShallowColor = colorShallow.value;
        applyAtmosphereAndDayNight(0);
      });
    }
    const colorDeep = document.getElementById('color-deep');
    if (colorDeep) {
      colorDeep.addEventListener('input', () => {
        state.customDeepColor = colorDeep.value;
        applyAtmosphereAndDayNight(0);
      });
    }

    function syncTuneInputs() {
      const setVal = (id, vId, v, txt) => {
        const el = document.getElementById(id);
        const vEl = document.getElementById(vId);
        if (el) el.value = String(v);
        if (vEl) vEl.textContent = txt;
      };
      setVal('slider-day-night', 'val-day-night', state.dayNightMix, Math.round(state.dayNightMix * 100) + '%');
      setVal('slider-clarity', 'val-clarity', state.clarity, state.clarity.toFixed(2));
      setVal('slider-foam', 'val-foam', state.foam, Math.round(state.foam * 100) + '%');
      setVal('slider-sun-el', 'val-sun-el', state.sunElevation, Math.round(state.sunElevation) + '°');
      setVal('slider-sun-az', 'val-sun-az', state.sunAzimuth, Math.round(state.sunAzimuth) + '°');
      const p = PRESETS[state.preset] || PRESETS.summer;
      if (colorShallow) colorShallow.value = state.customShallowColor || p.shallow;
      if (colorDeep) colorDeep.value = state.customDeepColor || p.deep;
    }

    // Initialize defaults
    applyAtmosphereAndDayNight(0);
    syncTuneInputs();
    updateAllLocalizedText();
    highlightActiveDropdownItems();

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = Math.max(1, window.innerHeight);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // 5. Main Animation Loop
    const clock = new THREE.Clock();
    let animFrameId = null;

    function animate() {
      animFrameId = requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.elapsedTime;

      if (state.autoRotate && !isDragging) {
        camSpherical.targetTheta += dt * state.autoRotateSpeed;
      }

      // Smoothly damp camera spherical coordinates & pan target
      const damp = 1.0 - Math.exp(-8.5 * dt);
      camSpherical.theta += (camSpherical.targetTheta - camSpherical.theta) * damp;
      camSpherical.phi += (camSpherical.targetPhi - camSpherical.phi) * damp;
      camSpherical.radius += (camSpherical.targetRadius - camSpherical.radius) * damp;
      camTarget.lerp(camTargetGoal, damp);

      // Smoothly animate water tide level
      state.currentWaterLevel += (state.targetWaterLevel - state.currentWaterLevel) * (1.0 - Math.exp(-4.5 * dt));
      waterData.uniforms.uWaterLevel.value = state.currentWaterLevel;

      // Smoothly animate Day <-> Night transition (silky exponential damping through Golden Dusk!)
      if (Math.abs(state.dayNightTarget - state.dayNightMix) > 0.0004) {
        state.dayNightMix += (state.dayNightTarget - state.dayNightMix) * (1.0 - Math.exp(-2.8 * dt));
        if (Math.abs(state.dayNightTarget - state.dayNightMix) <= 0.0004) {
          state.dayNightMix = state.dayNightTarget;
        }
        const slDN = document.getElementById('slider-day-night');
        const valDN = document.getElementById('val-day-night');
        if (slDN) slDN.value = String(state.dayNightMix);
        if (valDN) valDN.textContent = Math.round(state.dayNightMix * 100) + '%';
        applyAtmosphereAndDayNight(elapsed);
      } else if (state.dayNightMix > 0.02 && archData.updateNightEffects) {
        // Keep fireflies gently bobbing at night
        archData.updateNightEffects(elapsed, state.dayNightMix);
      }

      // Update camera world position from spherical coordinates
      const sinPhi = Math.sin(camSpherical.phi);
      const cosPhi = Math.cos(camSpherical.phi);
      const sinTheta = Math.sin(camSpherical.theta);
      const cosTheta = Math.cos(camSpherical.theta);

      camera.position.set(
        camTarget.x + camSpherical.radius * sinPhi * sinTheta,
        camTarget.y + camSpherical.radius * cosPhi,
        camTarget.z + camSpherical.radius * sinPhi * cosTheta
      );
      camera.lookAt(camTarget);

      // Update water waves & swimming koi fish
      waterData.updateWater(elapsed);

      renderer.render(scene, camera);
    }

    animate();

    // Expose programmatic API for testing & inspection
    window.ShrineDioramaApp = {
      scene,
      camera,
      renderer,
      state,
      applyPreset,
      setCameraView,
      setQuality,
      setLanguage,
      setDayNightMode,
      applyAtmosphereAndDayNight,
      setTide: (mode) => {
        if (btnTide && state.tide !== mode) btnTide.click();
      }
    };
  }

  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', initShrineDioramaApp);
  } else {
    initShrineDioramaApp();
  }
})();

  </script>
</body>
</html>
